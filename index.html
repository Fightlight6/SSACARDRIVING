<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>SSA Car Driving - Multi-Biome Open World by Sarim</title>

    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    
    <!-- FontAwesome Icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    
    <!-- Google Fonts -->
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;600;800&family=Orbitron:wght@500;700;900&display=swap" rel="stylesheet">
    
    <!-- Three.js 3D Engine -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>

    <style>
        * {
            box-sizing: border-box;
            user-select: none;
            -webkit-user-select: none;
            touch-action: manipulation;
        }
        body, html {
            margin: 0;
            padding: 0;
            width: 100%;
            height: 100%;
            overflow: hidden;
            font-family: 'Outfit', sans-serif;
            background-color: #020617;
            color: #ffffff;
        }
        .font-orbitron {
            font-family: 'Orbitron', sans-serif;
        }
        #canvas-container {
            width: 100vw;
            height: 100vh;
            position: absolute;
            top: 0;
            left: 0;
            z-index: 1;
        }
        .glass-panel {
            background: rgba(15, 23, 42, 0.85);
            backdrop-filter: blur(16px);
            -webkit-backdrop-filter: blur(16px);
            border: 1px solid rgba(255, 255, 255, 0.12);
            box-shadow: 0 8px 32px 0 rgba(0, 0, 0, 0.6);
        }
        .glass-btn {
            background: rgba(255, 255, 255, 0.08);
            backdrop-filter: blur(8px);
            border: 1px solid rgba(255, 255, 255, 0.18);
            transition: all 0.15s ease;
        }
        .glass-btn:hover, .glass-btn:active {
            background: rgba(6, 182, 212, 0.35);
            border-color: rgba(103, 232, 249, 0.8);
            transform: scale(0.96);
        }
        .touch-pad {
            background: rgba(255, 255, 255, 0.12);
            backdrop-filter: blur(8px);
            border: 1px solid rgba(255, 255, 255, 0.25);
            border-radius: 9999px;
            display: flex;
            align-items: center;
            justify-content: center;
            color: white;
            font-size: 1.5rem;
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.4);
            transition: background 0.1s, transform 0.1s;
        }
        .touch-pad:active, .touch-pad.active {
            background: rgba(6, 182, 212, 0.65);
            border-color: rgba(103, 232, 249, 0.8);
            transform: scale(0.92);
        }
        .toggle-badge {
            transition: all 0.2s ease;
        }
        .toggle-badge.active {
            background-color: rgba(16, 185, 129, 0.25);
            border-color: rgba(52, 211, 153, 0.8);
            color: #34d399;
        }
        .toggle-badge.inactive {
            background-color: rgba(239, 68, 68, 0.2);
            border-color: rgba(248, 113, 113, 0.5);
            color: #f87171;
        }
        #minimap-canvas {
            border-radius: 50%;
            border: 2px solid rgba(6, 182, 212, 0.6);
            background: rgba(15, 23, 42, 0.9);
            box-shadow: 0 0 18px rgba(6, 182, 212, 0.4);
        }
        @keyframes pulse-ring {
            0% { transform: scale(0.95); opacity: 0.8; }
            50% { transform: scale(1.05); opacity: 1; }
            100% { transform: scale(0.95); opacity: 0.8; }
        }
        .speed-flash {
            animation: pulse-ring 0.4s ease-in-out infinite;
        }
    </style>
</head>
<body>

    <div id="canvas-container"></div>

    <!-- Speed Motion & Collision Impact Vignette -->
    <div id="speed-vignette" class="fixed inset-0 pointer-events-none z-[2] opacity-0 transition-opacity duration-300 bg-[radial-gradient(circle_at_center,transparent_30%,rgba(6,182,212,0.35)_80%,rgba(2,6,23,0.85)_100%)]"></div>
    <div id="impact-vignette" class="fixed inset-0 pointer-events-none z-[3] opacity-0 transition-opacity duration-100 bg-red-600/30"></div>

    <div id="ui-overlay" class="relative z-10 w-full h-full pointer-events-none flex flex-col justify-between p-3 sm:p-5">
        
        <!-- Top Controls & Mini Map Navigation -->
        <div class="flex justify-between items-start w-full gap-2">
            
            <!-- Branding & Biome Location Indicator -->
            <div class="glass-panel p-2.5 sm:p-3.5 rounded-2xl flex items-center gap-3 pointer-events-auto">
                <div class="w-10 h-10 rounded-xl bg-gradient-to-tr from-cyan-500 via-blue-600 to-indigo-600 flex items-center justify-center text-white shadow-lg shadow-cyan-500/30">
                    <i class="fa-solid fa-car-burst text-lg"></i>
                </div>
                <div>
                    <h1 class="font-orbitron text-xs sm:text-base font-black tracking-wider text-white">APEX <span class="text-cyan-400">ULTRA 4.0</span></h1>
                    <div class="flex items-center gap-2 mt-0.5">
                        <span id="surface-dot" class="w-2 h-2 rounded-full bg-emerald-400 animate-pulse"></span>
                        <span class="text-[10px] text-cyan-300 font-bold uppercase tracking-wider font-orbitron" id="location-label">GRAND MOUNTAIN PASS</span>
                    </div>
                </div>
            </div>

            <!-- Top Action Bar & Assists -->
            <div class="flex items-center gap-2 pointer-events-auto flex-wrap justify-end">
                
                <!-- Driving Assists Toggles -->
                <div class="hidden md:flex items-center gap-1.5 glass-panel p-1.5 rounded-xl">
                    <button id="btn-abs" class="toggle-badge active px-2.5 py-1 rounded-lg border text-[10px] font-bold font-orbitron" title="Anti-lock Braking System">ABS</button>
                    <button id="btn-tc" class="toggle-badge active px-2.5 py-1 rounded-lg border text-[10px] font-bold font-orbitron" title="Traction Control System">TC</button>
                    <button id="btn-esp" class="toggle-badge active px-2.5 py-1 rounded-lg border text-[10px] font-bold font-orbitron" title="Electronic Stability Program">ESP</button>
                </div>

                <!-- Camera Switcher -->
                <button id="btn-camera" class="glass-btn h-10 px-3 rounded-xl flex items-center gap-2 text-gray-200 hover:text-white text-xs font-bold" title="Switch Camera (C)">
                    <i class="fa-solid fa-video text-cyan-400"></i>
                    <span id="cam-label" class="hidden sm:inline">Chase Cam</span>
                </button>

                <!-- Headlights Switch -->
                <button id="btn-lights" class="glass-btn w-10 h-10 rounded-xl flex items-center justify-center text-amber-400" title="Toggle Lights (L)">
                    <i id="icon-lights" class="fa-solid fa-lightbulb text-sm"></i>
                </button>

                <!-- Underglow Neon Toggle -->
                <button id="btn-neon" class="glass-btn w-10 h-10 rounded-xl flex items-center justify-center text-cyan-400" title="Toggle Underglow Neon (N)">
                    <i class="fa-solid fa-wand-magic-sparkles text-sm"></i>
                </button>

                <!-- Sound Engine Toggle -->
                <button id="btn-audio" class="glass-btn w-10 h-10 rounded-xl flex items-center justify-center text-gray-300" title="Toggle Sound Engine (M)">
                    <i id="icon-audio" class="fa-solid fa-volume-high text-sm"></i>
                </button>

                <!-- Unflip Vehicle -->
                <button id="btn-flip" class="glass-btn h-10 px-3 rounded-xl flex items-center gap-1.5 bg-amber-500/20 text-amber-300 hover:bg-amber-500/30 border-amber-500/40 text-xs font-bold" title="Unflip Car (F)">
                    <i class="fa-solid fa-car-on"></i>
                    <span class="hidden sm:inline">Flip</span>
                </button>

                <!-- Reset Vehicle -->
                <button id="btn-reset" class="glass-btn h-10 px-3 rounded-xl flex items-center gap-1.5 bg-red-500/20 text-red-300 hover:bg-red-500/30 border-red-500/40 text-xs font-bold" title="Reset Car Position (R)">
                    <i class="fa-solid fa-rotate-left"></i>
                    <span class="hidden sm:inline">Reset</span>
                </button>

                <!-- Minimap Radar Box -->
                <div class="glass-panel p-1 rounded-full pointer-events-auto ml-1 hidden sm:block">
                    <canvas id="minimap-canvas" width="110" height="110"></canvas>
                </div>
            </div>
        </div>

        <div class="flex flex-col items-center justify-center text-center my-auto">
            <!-- Drift Multiplier Score Card -->
            <div id="drift-box" class="opacity-0 transition-all duration-300 transform scale-90 glass-panel px-6 py-2.5 rounded-2xl border-cyan-500/50 shadow-xl shadow-cyan-500/20">
                <div class="text-[10px] uppercase tracking-widest text-cyan-400 font-bold">DRIFT & MOUNTAIN STUNT</div>
                <div id="drift-score" class="font-orbitron text-2xl sm:text-4xl font-black text-white">+0</div>
            </div>

            <!-- Speed Trap Radar Flash Toast -->
            <div id="speed-trap-box" class="hidden glass-panel px-6 py-3 rounded-2xl border-amber-500/80 shadow-2xl shadow-amber-500/40 text-center speed-flash">
                <div class="text-[10px] font-black text-amber-400 uppercase tracking-widest"><i class="fa-solid fa-camera text-sm mr-1"></i> SPEED RADAR RECORD</div>
                <div id="speed-trap-value" class="font-orbitron text-3xl font-black text-amber-300">248 KM/H</div>
            </div>

            <!-- Rings Collect Toast -->
            <div id="toast-msg" class="mt-2 glass-panel px-4 py-2 rounded-xl text-xs font-semibold text-cyan-200 opacity-0 transition-all duration-300 transform translate-y-2 border-cyan-500/30">
                Use W, S, A, D to Drive. Spacebar for Drift. Drive up into the Grand Mountains!
            </div>
        </div>

        <div class="flex flex-col gap-2 w-full">
            
            <!-- Driving Mode Switcher Bar -->
            <div class="glass-panel p-1.5 rounded-2xl mx-auto pointer-events-auto flex items-center gap-1 border-white/10">
                <button id="mode-comfort" class="mode-btn px-3 py-1 rounded-xl text-xs font-bold font-orbitron bg-white/10 text-gray-300 hover:text-white">COMFORT</button>
                <button id="mode-sport" class="mode-btn px-3 py-1 rounded-xl text-xs font-bold font-orbitron bg-cyan-500 text-white shadow-md shadow-cyan-500/30">SPORT</button>
                <button id="mode-drift" class="mode-btn px-3 py-1 rounded-xl text-xs font-bold font-orbitron bg-white/10 text-amber-400 hover:text-amber-300">DRIFT</button>
            </div>

            <!-- Cockpit Gauge & Mobile Controls Layout -->
            <div class="flex justify-between items-end w-full gap-2 sm:gap-4">
                
                <!-- Mobile Steering Controls Left -->
                <div id="touch-left-container" class="pointer-events-auto flex gap-2 sm:hidden mb-1">
                    <button id="touch-left" class="touch-pad w-14 h-14"><i class="fa-solid fa-arrow-left"></i></button>
                    <button id="touch-right" class="touch-pad w-14 h-14"><i class="fa-solid fa-arrow-right"></i></button>
                </div>

                <!-- Digital Speedometer Dashboard -->
                <div class="glass-panel p-3 sm:p-4 rounded-3xl pointer-events-auto mx-auto flex items-center gap-4 sm:gap-6 border-cyan-500/20 shadow-cyan-500/10">
                    
                    <!-- Nitro NOS Meter -->
                    <div class="flex flex-col items-center justify-center border-r border-white/10 pr-3 sm:pr-4">
                        <span class="text-[9px] font-black text-cyan-400 uppercase tracking-widest mb-1">NOS</span>
                        <div class="w-3 h-16 sm:h-20 bg-gray-900 rounded-full overflow-hidden flex flex-col justify-end p-0.5 border border-white/10">
                            <div id="nitro-bar" class="w-full bg-gradient-to-t from-cyan-500 to-blue-400 rounded-full transition-all duration-100" style="height: 100%;"></div>
                        </div>
                        <button id="btn-nitro-touch" class="mt-1 sm:hidden text-[9px] bg-cyan-500/30 text-cyan-300 px-2 py-0.5 rounded font-bold">NOS</button>
                    </div>

                    <!-- Digital Speedometer Display -->
                    <div class="flex flex-col items-center justify-center px-2 sm:px-4">
                        <span id="speed-display" class="font-orbitron text-4xl sm:text-6xl font-black tracking-tight text-white">0</span>
                        <span class="text-[10px] font-black text-cyan-400 uppercase tracking-widest mt-1">KM / H</span>
                    </div>

                    <!-- Altitude & Ring Telemetry -->
                    <div class="flex flex-col justify-center gap-1 border-l border-white/10 pl-3 sm:pl-6">
                        <div class="flex items-center gap-2">
                            <span class="text-[10px] text-gray-400 font-bold">ALT</span>
                            <span id="altitude-display" class="font-orbitron font-black text-xs text-amber-300">12m</span>
                        </div>
                        <div class="flex items-center gap-2">
                            <span class="text-[10px] text-gray-400 font-bold">GEAR</span>
                            <span id="gear-display" class="font-orbitron font-black text-xl text-cyan-400">1</span>
                        </div>
                        <div class="flex items-center gap-2">
                            <span class="text-[10px] text-gray-400 font-bold">RINGS</span>
                            <span id="rings-display" class="font-orbitron text-xs font-bold text-amber-400"><i class="fa-solid fa-ring mr-1"></i>0 / 16</span>
                        </div>
                    </div>
                </div>

                <!-- Mobile Acceleration & Handbrake Controls Right -->
                <div id="touch-right-container" class="pointer-events-auto flex items-end gap-1.5 sm:hidden mb-1">
                    <button id="touch-brake" class="touch-pad w-12 h-14 bg-red-500/20 text-red-400 border-red-500/30 text-xs"><i class="fa-solid fa-stop"></i></button>
                    <button id="touch-handbrake" class="touch-pad w-11 h-12 bg-amber-500/20 text-amber-400 border-amber-500/30 text-[10px] font-bold font-orbitron">P</button>
                    <button id="touch-gas" class="touch-pad w-14 h-16 bg-emerald-500/20 text-emerald-400 border-emerald-500/30 rounded-2xl"><i class="fa-solid fa-chevron-up"></i></button>
                </div>
            </div>
        </div>
    </div>

    <script>
        let scene, camera, renderer;
        let carGroup, bodyMesh, chassisMesh, wheelMeshes = [], brakeDiscs = [];
        let tailLightsMesh, brakeLightMat, reverseLightMat, headLights = [];
        let underglowLight, exhaustFlames = [];
        let keyState = {};
        let touchState = { gas: false, brake: false, left: false, right: false, handbrake: false, nitro: false };

        // Driving Assists
        let assists = { abs: true, tc: true, esp: true };
        let driveMode = "SPORT"; // COMFORT, SPORT, DRIFT

        // World Terrain Coordinates (Expanded Map: 3600 x 3600)
        const WORLD_SIZE = 3600;
        let terrainMesh, groundGeo;

        // Advanced Hypercar Physics & Dynamics Simulation State
        let carPos = new THREE.Vector3(-400, 0, 400); // Start position on mountain pass road
        let carVel = new THREE.Vector3(0, 0, 0);
        let carYaw = 0.8; // Heading orientation angle (radians)
        let carPitch = 0, carRoll = 0;
        let pitchVel = 0, rollVel = 0; // Rotational velocity for dynamic spring inertia
        let verticalVel = 0; // Suspended Y-axis velocity for gravity and spring shock absorption
        let steerAngle = 0;
        let currentSurface = "ASPHALT"; // ASPHALT, DIRT, SAND

        // Real-world Physical Specs (1,420 kg Supercar setup)
        const VEHICLE_MASS = 1420; // kg
        const WHEELBASE = 2.7; // meters
        const TRACK_WIDTH = 1.7; // meters
        const COG_HEIGHT = 0.42; // Center of Gravity height above ground

        // Suspension Spring & Damper Mechanics
        const SUSPENSION_REST_LENGTH = 0.50; // meters
        const SUSPENSION_STIFFNESS = 42.0; // Spring stiffness constant
        const SUSPENSION_DAMPING = 5.2; // Shock absorber damper coefficient
        let wheelCompressions = [0, 0, 0, 0]; // Visual compression delta per wheel [FL, FR, RL, RR]

        let currentSpeed = 0;
        let engineRPM = 800;
        let currentGear = "1";
        let isAirborne = false;

        // NOS Boost
        let nitroAmount = 100;
        let isNitroActive = false;

        // Collisions & Map Objects
        let collideables = [];
        let stuntRings = [];
        let speedTraps = [];
        let props = [];

        // Particles
        let particleGroup, smokeParticles = [], dustParticles = [], sparkParticles = [];

        // Cameras
        let cameraMode = 0;
        const cameraModeNames = ["Chase Cam", "Cockpit Cam", "Hood Cam", "Orbit Cam"];
        let cameraFOV = 60;
        let camShakeTime = 0;

        // Sound Synthesizer
        let audioCtx, engineOsc, engineFilter, engineGain;
        let audioEnabled = false;

        // Gameplay Metrics
        let driftScore = 0;
        let activeDriftCombo = 0;
        let ringsCollected = 0;
        let speedTrapCooldown = 0;

        window.addEventListener('load', () => {
            initThree();
            initLighting();
            buildMassiveRealisticWorld();
            createRealisticSupercar();
            spawnStuntRingsAndSpeedTraps();
            spawnBreakableProps();
            setupParticles();
            setupEvents();
            setupUI();

            animate();

            showToast("Welcome to Apex Drive Ultra 4.0! Explore mountains, canyon loops & cities!");
        });

        function initThree() {
            const container = document.getElementById('canvas-container');

            scene = new THREE.Scene();
            scene.background = new THREE.Color(0x0a1128); // Deep golden hour sky tint
            scene.fog = new THREE.FogExp2(0x0a1128, 0.00045); // Soft atmospheric haze

            camera = new THREE.PerspectiveCamera(60, window.innerWidth / window.innerHeight, 0.1, 4500);
            camera.position.set(0, 8, -12);

            renderer = new THREE.WebGLRenderer({ antialias: true, powerPreference: "high-performance" });
            renderer.setSize(window.innerWidth, window.innerHeight);
            renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
            renderer.shadowMap.enabled = true;
            renderer.shadowMap.type = THREE.PCFSoftShadowMap;
            renderer.toneMapping = THREE.ACESFilmicToneMapping;
            renderer.toneMappingExposure = 1.35;
            container.appendChild(renderer.domElement);
        }

        function initLighting() {
            // Warm Ambient Daylight
            const ambient = new THREE.AmbientLight(0x93c5fd, 0.65);
            scene.add(ambient);

            // Sunset Sun Directional Light
            const sun = new THREE.DirectionalLight(0xffedd5, 1.85);
            sun.position.set(500, 600, 300);
            sun.castShadow = true;
            sun.shadow.mapSize.width = 2048;
            sun.shadow.mapSize.height = 2048;
            sun.shadow.camera.near = 10;
            sun.shadow.camera.far = 1800;
            const d = 700;
            sun.shadow.camera.left = -d;
            sun.shadow.camera.right = d;
            sun.shadow.camera.top = d;
            sun.shadow.camera.bottom = -d;
            sun.shadow.bias = -0.0002;
            scene.add(sun);
        }

        function getTerrainElevation(x, z) {
            // 1. Mountain Peak Biome (North-West Quadrant)
            if (x < 100 && z < 100) {
                const distToPeak = Math.hypot(x + 700, z + 700);
                
                // Switchback Mountain Pass Carve-Out Path
                const roadAngle = Math.atan2(z + 700, x + 700);
                const roadRadius = 380 + Math.sin(roadAngle * 4) * 80;
                const distToRoadCurve = Math.abs(distToPeak - roadRadius);

                // Mountain elevation formula
                let baseMountain = Math.max(0, 220 - distToPeak * 0.28);
                baseMountain += Math.sin(x * 0.015) * 18 + Math.cos(z * 0.015) * 18;

                // Flatten out terrain smoothly along mountain road pass
                if (distToRoadCurve < 24) {
                    const roadFactor = distToRoadCurve / 24;
                    const roadHeight = 45 + Math.sin(roadAngle * 2) * 20;
                    return THREE.MathUtils.lerp(roadHeight, baseMountain, roadFactor);
                }
                return Math.max(0, baseMountain);
            }

            // 2. Desert Sand Dunes (South-West Quadrant)
            if (x < 0 && z >= 100) {
                return Math.sin(x * 0.012) * 12 + Math.cos(z * 0.014) * 14 + 2;
            }

            // 3. Stunt Arena & Flat City Avenues (East Quadrants)
            return 0;
        }

        function buildMassiveRealisticWorld() {
            // High-Density Terrain Grid (128x128 segments over 3600 units)
            const gridSegments = 160;
            groundGeo = new THREE.PlaneGeometry(WORLD_SIZE, WORLD_SIZE, gridSegments, gridSegments);
            groundGeo.rotateX(-Math.PI / 2);

            const pos = groundGeo.attributes.position;
            const colors = [];

            for (let i = 0; i < pos.count; i++) {
                const vx = pos.getX(i);
                const vz = pos.getZ(i);

                // Calculate elevation at coordinate
                const elevation = getTerrainElevation(vx, vz);
                pos.setY(i, elevation);

                // Dynamic Biome Shader Vertex Color Painting
                if (vx < 100 && vz < 100) {
                    // Mountain Biome
                    if (elevation > 110) {
                        // Snow/Rock Peaks (Light Gray/White)
                        colors.push(0.85, 0.88, 0.92);
                    } else if (elevation > 35) {
                        // Mountain Pine Forest / Slate Rock
                        colors.push(0.18, 0.26, 0.20);
                    } else {
                        // Mountain Base Grass
                        colors.push(0.12, 0.22, 0.16);
                    }
                } else if (vx < 0 && vz >= 100) {
                    // Desert Dunes (Golden Warm Sand)
                    colors.push(0.88, 0.65, 0.35);
                } else if (vx >= 0 && vz < 0) {
                    // Stunt Arena Base (Cyan Slate Asphalt)
                    colors.push(0.08, 0.18, 0.26);
                } else {
                    // Downtown Metropolis Asphalt Grid
                    colors.push(0.11, 0.14, 0.20);
                }
            }

            groundGeo.setAttribute('color', new THREE.Float32BufferAttribute(colors, 3));
            groundGeo.computeVertexNormals();

            const terrainMat = new THREE.MeshStandardMaterial({
                vertexColors: true,
                roughness: 0.85,
                metalness: 0.1
            });

            terrainMesh = new THREE.Mesh(groundGeo, terrainMat);
            terrainMesh.receiveShadow = true;
            scene.add(terrainMesh);

            // Perimeter Wall Barriers
            createPerimeterWalls(WORLD_SIZE / 2);

            buildMountainRoadNetwork();
            buildMetropolisCity();
            buildStuntArenaFeatures();
        }

        function createPerimeterWalls(boundary) {
            const wallMat = new THREE.MeshStandardMaterial({ color: 0x1e293b, roughness: 0.5 });
            const wallHeight = 25;

            const walls = [
                { x: 0, z: boundary, w: boundary * 2, d: 15 },
                { x: 0, z: -boundary, w: boundary * 2, d: 15 },
                { x: boundary, z: 0, w: 15, d: boundary * 2 },
                { x: -boundary, z: 0, w: 15, d: boundary * 2 }
            ];

            walls.forEach(w => {
                const mesh = new THREE.Mesh(new THREE.BoxGeometry(w.w, wallHeight, w.d), wallMat);
                mesh.position.set(w.x, wallHeight / 2, w.z);
                scene.add(mesh);

                collideables.push({
                    minX: w.x - w.w / 2,
                    maxX: w.x + w.w / 2,
                    minZ: w.z - w.d / 2,
                    maxZ: w.z + w.d / 2
                });
            });
        }

        function buildMountainRoadNetwork() {
            // Winding Mountain Pass Guardrails & Pine Trees
            const treeGeo = new THREE.ConeGeometry(6, 18, 8);
            const trunkGeo = new THREE.CylinderGeometry(0.8, 1.2, 5, 8);
            const foliageMat = new THREE.MeshStandardMaterial({ color: 0x14532d, roughness: 0.8 });
            const trunkMat = new THREE.MeshStandardMaterial({ color: 0x451a03, roughness: 0.9 });

            for (let i = 0; i < 180; i++) {
                const angle = Math.random() * Math.PI * 2;
                const radius = 250 + Math.random() * 320;
                const rx = -700 + Math.cos(angle) * radius;
                const rz = -700 + Math.sin(angle) * radius;
                const h = getTerrainElevation(rx, rz);

                if (h > 15) {
                    const treeGroup = new THREE.Group();
                    const foliage = new THREE.Mesh(treeGeo, foliageMat);
                    foliage.position.y = 11;
                    foliage.castShadow = true;

                    const trunk = new THREE.Mesh(trunkGeo, trunkMat);
                    trunk.position.y = 2.5;

                    treeGroup.add(foliage);
                    treeGroup.add(trunk);
                    treeGroup.position.set(rx, h, rz);
                    scene.add(treeGroup);

                    collideables.push({
                        minX: rx - 1.5, maxX: rx + 1.5, minZ: rz - 1.5, maxZ: rz + 1.5

        function createRamp(x, y, z, width, height, length, rotationY, colorHex) {
            const rampGroup = new THREE.Group();
            
            const shape = new THREE.Shape();
            shape.moveTo(0, 0);
            shape.lineTo(length, 0);
            shape.lineTo(length, height);
            shape.closePath();

            const extrudeSettings = { depth: width, bevelEnabled: false };
            const geo = new THREE.ExtrudeGeometry(shape, extrudeSettings);
            geo.rotateY(-Math.PI / 2);
            geo.translate(width / 2, 0, 0);

            const mat = new THREE.MeshStandardMaterial({ color: colorHex, roughness: 0.2, metalness: 0.7 });
            const rampMesh = new THREE.Mesh(geo, mat);
            rampMesh.castShadow = true;
            rampMesh.receiveShadow = true;
            rampGroup.add(rampMesh);

            rampGroup.position.set(x, y, z);
            rampGroup.rotation.y = rotationY;
            scene.add(rampGroup);
        }

        function initAudio() {
            if (audioCtx) return;
            try {
                audioCtx = new (window.AudioContext || window.webkitAudioContext)();

                engineOsc = audioCtx.createOscillator();
                engineOsc.type = 'sawtooth';
                engineOsc.frequency.setValueAtTime(65, audioCtx.currentTime);

                engineFilter = audioCtx.createBiquadFilter();
                engineFilter.type = 'lowpass';
                engineFilter.frequency.setValueAtTime(450, audioCtx.currentTime);

                engineGain = audioCtx.createGain();
                engineGain.gain.setValueAtTime(0.1, audioCtx.currentTime);

                engineOsc.connect(engineFilter);
                engineFilter.connect(engineGain);
                engineGain.connect(audioCtx.destination);
                engineOsc.start();

                audioEnabled = true;
            } catch (e) {
                console.warn("Audio Context blocked:", e);
            }
        }

        function updateAudio() {
            if (!audioEnabled || !audioCtx) return;
            const targetFreq = 55 + (engineRPM / 8000) * 480;
            engineOsc.frequency.setTargetAtTime(targetFreq, audioCtx.currentTime, 0.05);
            const filterFreq = 400 + (engineRPM / 8000) * 2800;
            engineFilter.frequency.setTargetAtTime(filterFreq, audioCtx.currentTime, 0.05);
        }

        function playImpactSound() {
            if (!audioEnabled || !audioCtx) return;
            const osc = audioCtx.createOscillator();
            const gain = audioCtx.createGain();
            osc.type = 'square';
            osc.frequency.setValueAtTime(130, audioCtx.currentTime);
            osc.frequency.exponentialRampToValueAtTime(30, audioCtx.currentTime + 0.2);
            gain.gain.setValueAtTime(0.35, audioCtx.currentTime);
            gain.gain.exponentialRampToValueAtTime(0.01, audioCtx.currentTime + 0.2);
            osc.connect(gain);
            gain.connect(audioCtx.destination);
            osc.start();
            osc.stop(audioCtx.currentTime + 0.2);
        }

                if (e.code === 'KeyL') toggleLights();
                if (e.code === 'KeyN') toggleUnderglow();
                if (e.code === 'KeyM') toggleAudio();
                if (!audioCtx) initAudio();
            });

            window.addEventListener('keyup', (e) => {
                keyState[e.code] = false;
            });

            bindTouch('touch-gas', 'gas');
            bindTouch('touch-brake', 'brake');

            bindTouch('touch-handbrake', 'handbrake');

            const btnNitroTouch = document.getElementById('btn-nitro-touch');
            if (btnNitroTouch) {
                btnNitroTouch.addEventListener('touchstart', (e) => { e.preventDefault(); touchState.nitro = true; });

        function bindTouch(id, prop) {
            const btn = document.getElementById(id);
            if (!btn) return;
            const start = (e) => { e.preventDefault(); touchState[prop] = true; btn.classList.add('active'); if (!audioCtx) initAudio(); };
            const end = (e) => { e.preventDefault(); touchState[prop] = false; btn.classList.remove('active'); };
            btn.addEventListener('touchstart', start, { passive: false });
            btn.addEventListener('touchend', end, { passive: false });
            btn.addEventListener('mousedown', start);
            btn.addEventListener('mouseup', end);
            btn.addEventListener('mouseleave', end);
        }

        let lastTime = performance.now();

        function animate() {
            requestAnimationFrame(animate);

            const now = performance.now();
            const delta = Math.min(0.05, (now - lastTime) / 1000);
            lastTime = now;

            // User Inputs
            const isAccelerating = keyState['KeyW'] || keyState['ArrowUp'] || touchState.gas;
            const isBraking = keyState['KeyS'] || keyState['ArrowDown'] || touchState.brake;
            const isSteerLeft = keyState['KeyA'] || keyState['ArrowLeft'] || touchState.left;
            const isSteerRight = keyState['KeyD'] || keyState['ArrowRight'] || touchState.right;
            const isHandbrake = keyState['Space'] || touchState.handbrake;
            const isNitroPressed = keyState['ShiftLeft'] || keyState['ShiftRight'] || touchState.nitro;

            // 1. SPEED-SENSITIVE POWER STEERING & ACKERMANN GEOMETRY
            // Power steering ratio dynamically tightens lock-to-lock at high speed to prevent high-speed flips
            const speedKmh = carVel.length() * 6;
            const maxSteerBase = driveMode === 'DRIFT' ? 0.62 : 0.48;
            const speedSteerFactor = Math.max(0.35, 1.0 - (speedKmh / 280) * 0.55); // Tightens lock at speed
            const maxSteer = maxSteerBase * speedSteerFactor;

            const targetSteer = isSteerLeft ? maxSteer : (isSteerRight ? -maxSteer : 0);
            // Self-centering feedback torque on steering wheel
            const steerReturnSpeed = (isSteerLeft || isSteerRight) ? 10 : 16;
            steerAngle = THREE.MathUtils.lerp(steerAngle, targetSteer, delta * steerReturnSpeed);

            // Ackermann inner/outer angle calculation for realistic wheel turn alignment
            const ackermannRatio = 0.28;
            const innerWheelAngle = steerAngle * (1 + (steerAngle > 0 ? ackermannRatio : -ackermannRatio));
            const outerWheelAngle = steerAngle * (1 - (steerAngle > 0 ? ackermannRatio : -ackermannRatio));
            
            wheelMeshes[0].rotation.y = steerAngle > 0 ? innerWheelAngle : outerWheelAngle; // Front Left
            wheelMeshes[1].rotation.y = steerAngle > 0 ? outerWheelAngle : innerWheelAngle; // Front Right

            // 2. ENGINE TORQUE & TRANSMISSION ACCELERATION
            let accelForce = 0;
            // Realistic, progressive acceleration curves
            const maxAccel = driveMode === 'SPORT' ? 8.5 : (driveMode === 'DRIFT' ? 9.5 : 6.2);

            if (isNitroPressed && nitroAmount > 0 && isAccelerating) {
                isNitroActive = true;
                nitroAmount = Math.max(0, nitroAmount - delta * 36);
                accelForce = maxAccel * 1.8;
                exhaustFlames.forEach(f => f.material.opacity = 0.95);
            } else {
                isNitroActive = false;
                exhaustFlames.forEach(f => f.material.opacity = 0);
                if (!isNitroPressed && nitroAmount < 100) nitroAmount = Math.min(100, nitroAmount + delta * 15);
                
                if (isAccelerating) accelForce = maxAccel;
                else if (isBraking) accelForce = -maxAccel * 0.85;
            }

            // Electronic Traction Control System (TCS) torque reduction on wheel spin
            if (assists.tc && isAccelerating && Math.abs(steerAngle) > 0.25) {
                accelForce *= 0.72;
            }

            // Directional Orientation Vectors
            const forwardDir = new THREE.Vector3(Math.sin(carYaw), 0, Math.cos(carYaw));
            const rightDir = new THREE.Vector3(Math.cos(carYaw), 0, -Math.sin(carYaw));

            // 3. PACEJKA TIRE FRICTION & DYNAMIC WEIGHT TRANSFER LOAD
            const forwardSpeed = carVel.dot(forwardDir);
            const lateralSpeed = carVel.dot(rightDir);

            // Longitudinal and Lateral G-Forces
            const accelLong = (accelForce - (forwardSpeed * 0.15)) / VEHICLE_MASS;
            const accelLat = (forwardSpeed * steerAngle) / 2.0;

            // Surface friction coefficient (Mu)
            const terrainHeightCurrent = getTerrainElevation(carPos.x, carPos.z);
            let surfaceFriction = 1.0; // Asphalt
            if (carPos.x < 100 && carPos.z < 100 && terrainHeightCurrent > 10) {
                surfaceFriction = 0.65; // Mountain Dirt/Gravel
                currentSurface = "DIRT";
            } else if (carPos.x < 0 && carPos.z >= 100) {
                surfaceFriction = 0.55; // Desert Sand
                currentSurface = "SAND";
            } else {
                currentSurface = "ASPHALT";
            }

            // Dynamic Normal Load Weight Transfer (Pitch Load Shift & Cornering Roll Load Shift)
            const weightFrontBackShift = (accelLong * COG_HEIGHT) / WHEELBASE;
            const weightLeftRightShift = (accelLat * COG_HEIGHT) / TRACK_WIDTH;

            const loadFL = Math.max(0.1, 0.25 - weightFrontBackShift - weightLeftRightShift);
            const loadFR = Math.max(0.1, 0.25 - weightFrontBackShift + weightLeftRightShift);
            const loadRL = Math.max(0.1, 0.25 + weightFrontBackShift - weightLeftRightShift);
            const loadRR = Math.max(0.1, 0.25 + weightFrontBackShift + weightLeftRightShift);

            // Slip Angle calculation for non-linear tire grip (Pacejka curve approximation)
            const slipAngle = Math.atan2(lateralSpeed, Math.abs(forwardSpeed) + 0.1) - (steerAngle * 0.7);
            const pacejkaGrip = Math.sin(1.8 * Math.atan(9.0 * slipAngle)) * surfaceFriction;

            // Forward Acceleration Impulse
            carVel.addScaledVector(forwardDir, accelForce * delta);

            // Friction & Aerodynamic Resistance
            let dragFactor = 0.988;
            if (isBraking && carVel.length() > 0.2) dragFactor = assists.abs ? 0.91 : 0.86;
            if (isHandbrake) dragFactor = 0.93;
            carVel.multiplyScalar(dragFactor);

            // Angular Yaw Turn Rate calculation with realistic vehicle wheelbase inertia
            const speedTurnFactor = Math.min(1.0, Math.abs(forwardSpeed) / 10.0);
            const turnFactor = driveMode === 'DRIFT' ? 1.6 : 1.1;
            const turnRate = steerAngle * speedTurnFactor * (12.0 / WHEELBASE) * turnFactor;
            carYaw += turnRate * delta;

            // Lateral Grip vs Sliding Dynamics
            let lateralGripFactor = 0.92 * surfaceFriction;
            if (driveMode === 'DRIFT' || isHandbrake) lateralGripFactor = 0.985;

            carVel.addScaledVector(rightDir, -lateralSpeed * (1.0 - lateralGripFactor));

            // Calculate Proposed Position
            const nextPos = carPos.clone().addScaledVector(carVel, delta * 6);

            // 4. ELASTIC WALL & BARRIER COLLISIONS
            let hasCollided = false;
            for (let c of collideables) {
                if (nextPos.x > c.minX && nextPos.x < c.maxX && nextPos.z > c.minZ && nextPos.z < c.maxZ) {
                    hasCollided = true;
                    // Elastic rebound with energy loss
                    carVel.multiplyScalar(-0.45);
                    triggerSparks(nextPos);
                    playImpactSound();

                    camShakeTime = 0.3;
                    const impactUI = document.getElementById('impact-vignette');
                    impactUI.style.opacity = '1';
                    setTimeout(() => impactUI.style.opacity = '0', 150);
                    break;
                }
            }

            if (!hasCollided) {
                carPos.copy(nextPos);
            }

            // 5. TRUE SPRING-DAMPER SUSPENSION & TERRAIN SLOPE ALIGNMENT
            const terrainHeight = getTerrainElevation(carPos.x, carPos.z);

            // Sample surrounding elevation for terrain surface normal vector
            const sampleDist = 2.2;
            const hL = getTerrainElevation(carPos.x - sampleDist, carPos.z);
            const hR = getTerrainElevation(carPos.x + sampleDist, carPos.z);
            const hF = getTerrainElevation(carPos.x, carPos.z + sampleDist);
            const hB = getTerrainElevation(carPos.x, carPos.z - sampleDist);

            const slopePitch = Math.atan2(hF - hB, sampleDist * 2);
            const slopeRoll = Math.atan2(hL - hR, sampleDist * 2);

            // Vertical Spring & Mass Damper Physics calculation
            const suspensionTargetY = terrainHeight;
            const springDisplacement = carPos.y - suspensionTargetY;

            if (carPos.y > terrainHeight + 0.15) {
                // Airborne state - Real Earth Gravity (~12.8 m/s² scaled to car size)
                isAirborne = true;
                verticalVel -= 12.8 * delta; // Realistic heavy gravity drop
                carPos.y += verticalVel * delta;

                if (carPos.y <= terrainHeight) {
                    // Touchdown Landing Impact Squat
                    carPos.y = terrainHeight;
                    verticalVel = -verticalVel * 0.18; // Heavy suspension rebound absorption
                    isAirborne = false;
                    camShakeTime = 0.2;
                }
            } else {
                // Grounded Suspension Mass System (F = -k*x - c*v)
                isAirborne = false;
                const springForce = -SUSPENSION_STIFFNESS * springDisplacement;
                const dampingForce = -SUSPENSION_DAMPING * verticalVel;
                const totalAccelY = (springForce + dampingForce);

                verticalVel += totalAccelY * delta;
                carPos.y += verticalVel * delta;

                // Restrict ground penetration
                if (carPos.y < terrainHeight) {
                    carPos.y = terrainHeight;
                    if (verticalVel < 0) verticalVel = 0;
                }
            }

            // Chassis Pitch & Roll Rotational Inertia with Body Tilt
            const targetPitch = slopePitch + (accelForce / maxAccel) * -0.08 + (isAirborne ? -0.15 : 0);
            
            // Cornering Body Roll & Tipping dynamics (Outward lean on high-G turns)
            const centrifugalRoll = (lateralSpeed / 8.5) * -0.22;
            const targetRoll = slopeRoll + centrifugalRoll;

            // Rotational spring physics for realistic chassis body roll & tipping physics
            pitchVel += (targetPitch - carPitch) * 18.0 * delta - (pitchVel * 7.0 * delta);
            rollVel += (targetRoll - carRoll) * 18.0 * delta - (rollVel * 7.0 * delta);

            carPitch += pitchVel * delta;
            carRoll += rollVel * delta;

            // Roll-over hazard when cornering hard at speed without ESP
            if (!assists.esp && Math.abs(carRoll) > 0.42 && currentSpeed > 65) {
                carRoll += Math.sign(carRoll) * 0.75 * delta;
            }

            // Visual Wheel Travel Suspension Compression Sync
            const loads = [loadFL, loadFR, loadRL, loadRR];
            wheelMeshes.forEach((w, idx) => {
                const comp = (loads[idx] - 0.25) * 0.35;
                w.position.y = 0.46 - Math.max(-0.15, Math.min(0.22, comp));
            });

            // Synchronize Supercar 3D Group Transforms
            carGroup.position.copy(carPos);
            carGroup.rotation.y = carYaw;
            chassisMesh.rotation.x = carPitch;
            chassisMesh.rotation.z = carRoll;

            // Wheel Angular Rotation Speed
            const wheelSpinSpeed = forwardSpeed * delta * 1.4;
            wheelMeshes.forEach(w => w.children[0].rotation.x += wheelSpinSpeed);

            // Speed Display Telemetry
            currentSpeed = carVel.length() < 0.05 ? 0 : Math.round(carVel.length() * 6);

            // Dynamic Taillight Brightness on Braking
            if (isBraking && currentSpeed > 2) {
                brakeLightMat.color.setHex(0xef4444);
            } else {
                brakeLightMat.color.setHex(0x991b1b);
            }

            // 6. STUNT RINGS CHECK
            stuntRings.forEach(ring => {
                if (!ring.collected && carPos.distanceTo(ring.pos) < 6.5) {
                    ring.collected = true;
                    ring.mesh.visible = false;
                    ringsCollected++;
                    driftScore += 1000;
                    showToast(`+1000 STUNT RING COLLECTED! (${ringsCollected}/${stuntRings.length})`);
                    document.getElementById('rings-display').innerText = `${ringsCollected} / ${stuntRings.length}`;
                }
            });

            // 7. REALISTIC DRIFT & DUST PARTICLES
            // Require high speed (>28 km/h) AND actual rear-end breakaway slide (lateral speed > 2.6 m/s)
            const slideSeverity = Math.abs(lateralSpeed);
            const isRearSliding = slideSeverity > 2.6 || (isHandbrake && slideSeverity > 1.4);
            const isDrifting = isRearSliding && currentSpeed > 28;
            const isMountainDirt = currentSurface === "DIRT";

            if (isDrifting || (isMountainDirt && currentSpeed > 15)) {
                const rearPos = carPos.clone().add(new THREE.Vector3(1, 0.2, -1.3).applyAxisAngle(new THREE.Vector3(0,1,0), carYaw));
                triggerTireSmoke(rearPos, isMountainDirt);

                if (isDrifting) {
                    // Drift score now scales only with true sliding severity & speed
                    const driftQuality = (slideSeverity - 1.5) * (currentSpeed / 35);
                    activeDriftCombo += Math.round(driftQuality * 14);
                    document.getElementById('drift-box').classList.remove('opacity-0', 'scale-90');
                    document.getElementById('drift-score').innerText = `+${activeDriftCombo}`;
                }
            } else if (activeDriftCombo > 0) {
                driftScore += activeDriftCombo;
                activeDriftCombo = 0;
                setTimeout(() => document.getElementById('drift-box').classList.add('opacity-0', 'scale-90'), 1000);
            }

            // Breakable Props
            props.forEach(p => {
                const dist = p.mesh.position.distanceTo(carPos);
                if (dist < p.radius + 1.2) {
                    p.vel.copy(carVel).multiplyScalar(1.5);
                    p.vel.y = 6 + Math.random() * 4;
                    p.rotVel.set(Math.random() * 10, Math.random() * 10, Math.random() * 10);
                }

                if (p.vel.length() > 0.1) {
                    p.mesh.position.addScaledVector(p.vel, delta);
                    p.mesh.rotation.x += p.rotVel.x * delta;
                    p.mesh.rotation.y += p.rotVel.y * delta;
                    p.vel.multiplyScalar(0.95);
                    const propGround = getTerrainElevation(p.mesh.position.x, p.mesh.position.z) + 0.75;
                    if (p.mesh.position.y > propGround) p.vel.y -= 14 * delta;
                    else { p.mesh.position.y = propGround; p.vel.y = 0; }
                }
            });

            // Particles Update
            smokeParticles.concat(dustParticles).forEach(p => {
                if (p.mesh.visible) {
                    p.life += delta;
                    p.mesh.position.y += delta * 1.3;
                    p.mesh.scale.addScalar(delta * 1.6);
                    p.mesh.material.opacity = 0.7 * (1 - p.life / p.maxLife);
                    if (p.life >= p.maxLife) p.mesh.visible = false;
                }
            });

            sparkParticles.forEach(s => {
                if (s.mesh.visible) {
                    s.life += delta;
                    s.mesh.position.addScaledVector(s.vel, delta);
                    if (s.life > 0.3) s.mesh.visible = false;
                }
            });

            // RPM Transmission
            if (isAccelerating) {
                engineRPM = Math.min(8200, 900 + (currentSpeed % 48) * 150 + currentSpeed * 18);
            } else {
                engineRPM = Math.max(800, engineRPM - 120);
            }

            if (currentSpeed < 2 && isBraking) currentGear = 'R';
            else if (currentSpeed < 38) currentGear = '1';
            else if (currentSpeed < 80) currentGear = '2';
            else if (currentSpeed < 130) currentGear = '3';
            else if (currentSpeed < 185) currentGear = '4';
            else currentGear = '5';

            updateAudio();
            updateCamera(delta);
            updateHUD();
            drawMinimap();

            renderer.render(scene, camera);
        }

        function updateCamera(delta) {
            const targetFOV = 60 + Math.min(25, (currentSpeed / 200) * 20 + (isNitroActive ? 14 : 0));
            cameraFOV += (targetFOV - cameraFOV) * 0.1;
            camera.fov = cameraFOV;
            camera.updateProjectionMatrix();

            let shakeOffset = new THREE.Vector3();
            if (camShakeTime > 0) {
                camShakeTime -= delta;
                shakeOffset.set((Math.random() - 0.5) * 0.8, (Math.random() - 0.5) * 0.8, (Math.random() - 0.5) * 0.8);
            }

            if (cameraMode === 0) {
                // Chase Cam
                const offset = new THREE.Vector3(0, 3.6, -9.5).applyAxisAngle(new THREE.Vector3(0, 1, 0), carYaw);
                const targetPos = carPos.clone().add(offset).add(shakeOffset);
                camera.position.lerp(targetPos, 0.22);
                camera.lookAt(carPos.clone().add(new THREE.Vector3(0, 1.2, 2.5).applyAxisAngle(new THREE.Vector3(0, 1, 0), carYaw)));
            } else if (cameraMode === 1) {
                // Cockpit Cam
                const offset = new THREE.Vector3(0, 1.18, 0.1).applyAxisAngle(new THREE.Vector3(0, 1, 0), carYaw);
                camera.position.copy(carPos.clone().add(offset).add(shakeOffset));
                const lookTarget = carPos.clone().add(new THREE.Vector3(0, 1.18, 15).applyAxisAngle(new THREE.Vector3(0, 1, 0), carYaw));
                camera.lookAt(lookTarget);
            } else if (cameraMode === 2) {
                // Hood Cam
                const offset = new THREE.Vector3(0, 0.85, 1.6).applyAxisAngle(new THREE.Vector3(0, 1, 0), carYaw);
                camera.position.copy(carPos.clone().add(offset).add(shakeOffset));
                const lookTarget = carPos.clone().add(new THREE.Vector3(0, 0.8, 15).applyAxisAngle(new THREE.Vector3(0, 1, 0), carYaw));
                camera.lookAt(lookTarget);
            } else if (cameraMode === 3) {
                // Orbit Cam
                const t = Date.now() * 0.0006;
                camera.position.set(carPos.x + Math.sin(t) * 16, carPos.y + 6, carPos.z + Math.cos(t) * 16);
                camera.lookAt(carPos);
            }
        }

        function updateHUD() {
            document.getElementById('speed-display').innerText = currentSpeed;
            document.getElementById('gear-display').innerText = currentGear;
            document.getElementById('altitude-display').innerText = `${Math.round(carPos.y)}m`;

            const nitroBar = document.getElementById('nitro-bar');
            if (nitroBar) nitroBar.style.height = `${nitroAmount}%`;

            const speedVignette = document.getElementById('speed-vignette');
            if (speedVignette) {
                speedVignette.style.opacity = Math.min(0.8, Math.max(0, (currentSpeed - 60) / 150) + (isNitroActive ? 0.45 : 0));
            }

            // Location Biome Identifier
            const locLabel = document.getElementById('location-label');
            const dot = document.getElementById('surface-dot');

            if (carPos.x < 100 && carPos.z < 100) {
                locLabel.innerText = "GRAND MOUNTAIN PASS";
                dot.className = "w-2 h-2 rounded-full bg-emerald-400 animate-pulse";
            } else if (carPos.x < 0 && carPos.z >= 100) {
                locLabel.innerText = "DESERT SAND DUNES";
                dot.className = "w-2 h-2 rounded-full bg-amber-400 animate-pulse";
            } else if (carPos.x >= 0 && carPos.z < 0) {
                locLabel.innerText = "STUNT ARENA & LOOPS";
                dot.className = "w-2 h-2 rounded-full bg-cyan-400 animate-pulse";
            } else {
                locLabel.innerText = "DOWNTOWN METROPOLIS";
                dot.className = "w-2 h-2 rounded-full bg-blue-400 animate-pulse";
            }
        }

        function drawMinimap() {
            const canvas = document.getElementById('minimap-canvas');
            if (!canvas) return;
            const ctx = canvas.getContext('2d');
            const w = canvas.width;
            const h = canvas.height;

            ctx.clearRect(0, 0, w, h);

            ctx.save();
            ctx.translate(w / 2, h / 2);

            const scale = 0.055;

            // Minimap Biome Base
            ctx.fillStyle = "rgba(15, 23, 42, 0.85)";
            ctx.fillRect(-w, -h, w * 2, h * 2);

            // Stunt Rings
            ctx.fillStyle = "#f59e0b";
            stuntRings.forEach(ring => {
                if (!ring.collected) {
                    const rx = (ring.pos.x - carPos.x) * scale;
                    const rz = -(ring.pos.z - carPos.z) * scale;
                    ctx.beginPath();
                    ctx.arc(rx, rz, 2.5, 0, Math.PI * 2);
                    ctx.fill();
                }
            });

            // Player Car Marker
            ctx.fillStyle = "#06b6d4";
            ctx.save();
            ctx.rotate(-carYaw);
            ctx.beginPath();
            ctx.moveTo(0, -6);
            ctx.lineTo(-4, 5);
            ctx.lineTo(4, 5);
            ctx.closePath();
            ctx.fill();
            ctx.restore();

            ctx.restore();
        }
    </script>
</body>
