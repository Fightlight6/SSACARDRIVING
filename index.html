<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Extreme Car Driving Simulator</title>

    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    
    <!-- FontAwesome Icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    
    <!-- Google Fonts -->
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;600;800&family=Orbitron:wght@500;700;900&display=swap" rel="stylesheet">
    
    <!-- Three.js 3D Engine -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>

    <style>
        * {
            box-sizing: border-box;
            user-select: none;
            -webkit-user-select: none;
            touch-action: manipulation;
        }
        body, html {
            margin: 0;
            padding: 0;
            width: 100%;
            height: 100%;
            overflow: hidden;
            font-family: 'Outfit', sans-serif;
            background-color: #030712;
            color: #ffffff;
        }
        .font-orbitron {
            font-family: 'Orbitron', sans-serif;
        }
        #canvas-container {
            width: 100vw;
            height: 100vh;
            position: absolute;
            top: 0;
            left: 0;
            z-index: 1;
        }
        .glass-panel {
            background: rgba(15, 23, 42, 0.85);
            backdrop-filter: blur(16px);
            -webkit-backdrop-filter: blur(16px);
            border: 1px solid rgba(255, 255, 255, 0.15);
            box-shadow: 0 8px 32px 0 rgba(0, 0, 0, 0.6);
        }
        .glass-btn {
            background: rgba(255, 255, 255, 0.08);
            backdrop-filter: blur(8px);
            border: 1px solid rgba(255, 255, 255, 0.18);
            transition: all 0.15s ease;
        }
        .glass-btn:hover, .glass-btn:active {
            background: rgba(59, 130, 246, 0.4);
            border-color: rgba(147, 197, 253, 0.8);
            transform: scale(0.96);
        }
        .touch-pad {
            background: rgba(255, 255, 255, 0.12);
            backdrop-filter: blur(8px);
            border: 1px solid rgba(255, 255, 255, 0.25);
            border-radius: 9999px;
            display: flex;
            align-items: center;
            justify-content: center;
            color: white;
            font-size: 1.5rem;
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.4);
            transition: background 0.1s, transform 0.1s;
        }
        .touch-pad:active, .touch-pad.active {
            background: rgba(59, 130, 246, 0.65);
            border-color: rgba(147, 197, 253, 0.8);
            transform: scale(0.92);
        }
        .toggle-badge {
            transition: all 0.2s ease;
        }
        .toggle-badge.active {
            background-color: rgba(16, 185, 129, 0.25);
            border-color: rgba(52, 211, 153, 0.8);
            color: #34d399;
        }
        .toggle-badge.inactive {
            background-color: rgba(239, 68, 68, 0.2);
            border-color: rgba(248, 113, 113, 0.5);
            color: #f87171;
        }
    </style>
</head>
<body>

    <!-- 3D WebGL Canvas -->
    <div id="canvas-container"></div>

    <!-- Speed Motion Vignette -->
    <div id="speed-vignette" class="fixed inset-0 pointer-events-none z-[2] opacity-0 transition-opacity duration-300 bg-[radial-gradient(circle_at_center,transparent_30%,rgba(6,182,212,0.3)_80%,rgba(0,0,0,0.8)_100%)]"></div>

    <!-- Main Game UI Overlay -->
    <div id="ui-overlay" class="relative z-10 w-full h-full pointer-events-none flex flex-col justify-between p-3 sm:p-5">
        
        <!-- Top Navigation & Controls Header -->
        <div class="flex justify-between items-start w-full gap-2">
            
            <!-- Branding Badge -->
            <div class="glass-panel p-2.5 sm:p-3.5 rounded-2xl flex items-center gap-3 pointer-events-auto">
                <div class="w-10 h-10 rounded-xl bg-gradient-to-tr from-cyan-500 via-blue-600 to-indigo-600 flex items-center justify-center text-white shadow-lg shadow-cyan-500/30">
                    <i class="fa-solid fa-gauge-high text-lg"></i>
                </div>
                <div>
                    <h1 class="font-orbitron text-xs sm:text-base font-black tracking-wider text-white">EXTREME <span class="text-cyan-400">DRIVING</span></h1>
                    <div class="flex items-center gap-2 mt-0.5">
                        <span class="text-[10px] text-gray-300 font-bold uppercase tracking-wider" id="location-label">Stunt City & Airport</span>
                    </div>
                </div>
            </div>

            <!-- Assist Systems & Top Action Buttons -->
            <div class="flex items-center gap-2 pointer-events-auto flex-wrap justify-end">
                
                <!-- Driving Assists Toggles (ABS / TC / ESP) -->
                <div class="hidden md:flex items-center gap-1.5 glass-panel p-1.5 rounded-xl">
                    <button id="btn-abs" class="toggle-badge active px-2.5 py-1 rounded-lg border text-[10px] font-bold font-orbitron" title="Anti-lock Braking System">ABS</button>
                    <button id="btn-tc" class="toggle-badge active px-2.5 py-1 rounded-lg border text-[10px] font-bold font-orbitron" title="Traction Control System">TC</button>
                    <button id="btn-esp" class="toggle-badge active px-2.5 py-1 rounded-lg border text-[10px] font-bold font-orbitron" title="Electronic Stability Program">ESP</button>
                </div>

                <!-- Camera Switcher -->
                <button id="btn-camera" class="glass-btn h-10 px-3 rounded-xl flex items-center gap-2 text-gray-200 hover:text-white text-xs font-bold" title="Switch Camera (C)">
                    <i class="fa-solid fa-video text-cyan-400"></i>
                    <span id="cam-label" class="hidden sm:inline">Chase Cam</span>
                </button>

                <!-- Headlights -->
                <button id="btn-lights" class="glass-btn w-10 h-10 rounded-xl flex items-center justify-center text-amber-400" title="Toggle Lights (L)">
                    <i id="icon-lights" class="fa-solid fa-lightbulb text-sm"></i>
                </button>

                <!-- Sound Engine -->
                <button id="btn-audio" class="glass-btn w-10 h-10 rounded-xl flex items-center justify-center text-gray-300" title="Toggle Engine Audio (M)">
                    <i id="icon-audio" class="fa-solid fa-volume-high text-sm"></i>
                </button>

                <!-- Unflip Vehicle -->
                <button id="btn-flip" class="glass-btn h-10 px-3 rounded-xl flex items-center gap-1.5 bg-amber-500/20 text-amber-300 hover:bg-amber-500/30 border-amber-500/40 text-xs font-bold" title="Unflip Car (F)">
                    <i class="fa-solid fa-car-on"></i>
                    <span class="hidden sm:inline">Flip</span>
                </button>

                <!-- Reset Car -->
                <button id="btn-reset" class="glass-btn h-10 px-3 rounded-xl flex items-center gap-1.5 bg-red-500/20 text-red-300 hover:bg-red-500/30 border-red-500/40 text-xs font-bold" title="Reset Car Position (R)">
                    <i class="fa-solid fa-rotate-left"></i>
                    <span class="hidden sm:inline">Reset</span>
                </button>
            </div>
        </div>

        <!-- Center Drift & Stunt Popups -->
        <div class="flex flex-col items-center justify-center text-center my-auto">
            <div id="drift-box" class="opacity-0 transition-all duration-300 transform scale-90 glass-panel px-6 py-2.5 rounded-2xl border-cyan-500/50 shadow-xl shadow-cyan-500/20">
                <div class="text-[10px] uppercase tracking-widest text-cyan-400 font-bold">EXTREME DRIFT SCORE</div>
                <div id="drift-score" class="font-orbitron text-2xl sm:text-4xl font-black text-white">+0</div>
            </div>
            <div id="toast-msg" class="mt-2 glass-panel px-4 py-2 rounded-xl text-xs font-semibold text-cyan-200 opacity-0 transition-all duration-300 transform translate-y-2 border-cyan-500/30">
                Use W, S, A, D to Drive. Spacebar to Handbrake Drift!
            </div>
        </div>

        <!-- Bottom Dashboard & Driving Mode Selector -->
        <div class="flex flex-col gap-2 w-full">
            
            <!-- Drive Mode Switcher Bar -->
            <div class="glass-panel p-1.5 rounded-2xl mx-auto pointer-events-auto flex items-center gap-1 border-white/10">
                <button id="mode-comfort" class="mode-btn px-3 py-1 rounded-xl text-xs font-bold font-orbitron bg-white/10 text-gray-300 hover:text-white">COMFORT</button>
                <button id="mode-sport" class="mode-btn px-3 py-1 rounded-xl text-xs font-bold font-orbitron bg-cyan-500 text-white shadow-md shadow-cyan-500/30">SPORT</button>
                <button id="mode-drift" class="mode-btn px-3 py-1 rounded-xl text-xs font-bold font-orbitron bg-white/10 text-amber-400 hover:text-amber-300">DRIFT</button>
            </div>

            <!-- Cockpit Gauge & Mobile Controls Layout -->
            <div class="flex justify-between items-end w-full gap-2 sm:gap-4">
                
                <!-- Mobile Steering Controls Left -->
                <div id="touch-left-container" class="pointer-events-auto flex gap-2 sm:hidden mb-1">
                    <button id="touch-left" class="touch-pad w-14 h-14"><i class="fa-solid fa-arrow-left"></i></button>
                    <button id="touch-right" class="touch-pad w-14 h-14"><i class="fa-solid fa-arrow-right"></i></button>
                </div>

                <!-- Digital Speedometer Cockpit -->
                <div class="glass-panel p-3 sm:p-4 rounded-3xl pointer-events-auto mx-auto flex items-center gap-4 sm:gap-6 border-cyan-500/20 shadow-cyan-500/10">
                    
                    <!-- Nitro NOS Meter -->
                    <div class="flex flex-col items-center justify-center border-r border-white/10 pr-3 sm:pr-4">
                        <span class="text-[9px] font-black text-cyan-400 uppercase tracking-widest mb-1">NOS</span>
                        <div class="w-3 h-16 sm:h-20 bg-gray-900 rounded-full overflow-hidden flex flex-col justify-end p-0.5 border border-white/10">
                            <div id="nitro-bar" class="w-full bg-gradient-to-t from-cyan-500 to-blue-400 rounded-full transition-all duration-100" style="height: 100%;"></div>
                        </div>
                        <button id="btn-nitro-touch" class="mt-1 sm:hidden text-[9px] bg-cyan-500/30 text-cyan-300 px-2 py-0.5 rounded font-bold">NOS</button>
                    </div>

                    <!-- Digital Speedometer Display -->
                    <div class="flex flex-col items-center justify-center px-2 sm:px-4">
                        <span id="speed-display" class="font-orbitron text-4xl sm:text-6xl font-black tracking-tight text-white">0</span>
                        <span class="text-[10px] font-black text-cyan-400 uppercase tracking-widest mt-1">KM / H</span>
                    </div>

                    <!-- Gear & RPM Info -->
                    <div class="flex flex-col justify-center gap-1 border-l border-white/10 pl-3 sm:pl-6">
                        <div class="flex items-center gap-2">
                            <span class="text-[10px] text-gray-400 font-bold">GEAR</span>
                            <span id="gear-display" class="font-orbitron font-black text-xl text-cyan-400">1</span>
                        </div>
                        <div class="flex items-center gap-2">
                            <span class="text-[10px] text-gray-400 font-bold">RPM</span>
                            <span id="rpm-display" class="font-orbitron text-xs font-semibold text-gray-200">800</span>
                        </div>
                        <div class="flex items-center gap-1.5 mt-1">
                            <span id="badge-assist" class="text-[9px] bg-emerald-500/20 text-emerald-400 border border-emerald-500/30 px-1.5 py-0.5 rounded font-bold font-orbitron">TC OFF</span>
                        </div>
                    </div>
                </div>

                <!-- Mobile Gas & Brake Controls Right -->
                <div id="touch-right-container" class="pointer-events-auto flex items-end gap-1.5 sm:hidden mb-1">
                    <button id="touch-brake" class="touch-pad w-12 h-14 bg-red-500/20 text-red-400 border-red-500/30 text-xs"><i class="fa-solid fa-stop"></i></button>
                    <button id="touch-handbrake" class="touch-pad w-11 h-12 bg-amber-500/20 text-amber-400 border-amber-500/30 text-[10px] font-bold font-orbitron">P</button>
                    <button id="touch-gas" class="touch-pad w-14 h-16 bg-emerald-500/20 text-emerald-400 border-emerald-500/30 rounded-2xl"><i class="fa-solid fa-chevron-up"></i></button>
                </div>
            </div>
        </div>
    </div>

    <script>
        /* =========================================================================
           EXTREME CAR DRIVING SIMULATOR ENGINE
           Built on Three.js 3D WebGL with Snappy Custom Physics Solver
           ========================================================================= */

        let scene, camera, renderer;
        let carGroup, bodyMesh, wheelMeshes = [];
        let keyState = {};
        let touchState = { gas: false, brake: false, left: false, right: false, handbrake: false, nitro: false };

        // Assist Toggles
        let assists = { abs: true, tc: true, esp: true };
        let driveMode = "SPORT"; // COMFORT, SPORT, DRIFT

        // Car Physics Parameters
        let carPos = new THREE.Vector3(0, 0, 0);
        let carVel = new THREE.Vector3(0, 0, 0);
        let carYaw = 0; // Direction angle in radians
        let carPitch = 0;
        let carRoll = 0;
        let steerAngle = 0;

        let currentSpeed = 0; // KM/H
        let engineRPM = 800;
        let currentGear = "1";

        // Nitro NOS
        let nitroAmount = 100;
        let isNitroActive = false;

        // Visual Assets & Lights
        let headLights = [], tailLights = [];
        let particleGroup, smokeParticles = [], skidMarks = [];
        let props = []; // Breakable crates and traffic cones

        // Camera Modes
        let cameraMode = 0;
        const cameraModeNames = ["Chase Cam", "Cockpit Cam", "Hood Cam", "Orbit Cam"];
        let cameraFOV = 60;

        // Audio Engine
        let audioCtx, engineOsc, engineFilter, engineGain, screechNode, screechGain, screechBuffer;
        let audioEnabled = false;

        // Drift Tracking
        let driftScore = 0;
        let activeDriftCombo = 0;

        window.addEventListener('load', () => {
            initThree();
            initLighting();
            buildStuntWorldMap();
            createExtremeSupercar();
            spawnBreakableProps();
            setupParticles();
            setupEvents();
            setupUI();

            // Start Main Simulation Loop
            animate();

            showToast("Welcome to Extreme Car Driving Simulator! Press W to Accelerate.");
        });

        /* =========================================================================
           THREE.JS GRAPHICS SCENE SETUP
           ========================================================================= */
        function initThree() {
            const container = document.getElementById('canvas-container');

            scene = new THREE.Scene();
            scene.background = new THREE.Color(0x0f172a);
            scene.fog = new THREE.FogExp2(0x0f172a, 0.0018);

            camera = new THREE.PerspectiveCamera(60, window.innerWidth / window.innerHeight, 0.1, 2000);
            camera.position.set(0, 5, -10);

            renderer = new THREE.WebGLRenderer({ antialias: true, powerPreference: "high-performance" });
            renderer.setSize(window.innerWidth, window.innerHeight);
            renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
            renderer.shadowMap.enabled = true;
            renderer.shadowMap.type = THREE.PCFSoftShadowMap;
            renderer.toneMapping = THREE.ACESFilmicToneMapping;
            renderer.toneMappingExposure = 1.2;
            container.appendChild(renderer.domElement);
        }

        function initLighting() {
            const ambient = new THREE.AmbientLight(0xffedd5, 0.75);
            scene.add(ambient);

            const sun = new THREE.DirectionalLight(0xffedd5, 1.6);
            sun.position.set(150, 200, 100);
            sun.castShadow = true;
            sun.shadow.mapSize.width = 2048;
            sun.shadow.mapSize.height = 2048;
            sun.shadow.camera.near = 10;
            sun.shadow.camera.far = 500;
            const d = 200;
            sun.shadow.camera.left = -d;
            sun.shadow.camera.right = d;
            sun.shadow.camera.top = d;
            sun.shadow.camera.bottom = -d;
            sun.shadow.bias = -0.0005;
            scene.add(sun);
        }

        /* =========================================================================
           WORLD MAP, STUNT AIRPORT, RAMPS & LOOPS
           ========================================================================= */
        function buildStuntWorldMap() {
            // Main Ground Base
            const groundGeo = new THREE.PlaneGeometry(1200, 1200);
            const groundMat = new THREE.MeshStandardMaterial({ color: 0x1e293b, roughness: 0.8 });
            const ground = new THREE.Mesh(groundGeo, groundMat);
            ground.rotation.x = -Math.PI / 2;
            ground.receiveShadow = true;
            scene.add(ground);

            // Airport Runway Asphalt
            const runwayMat = new THREE.MeshStandardMaterial({ color: 0x0f172a, roughness: 0.5 });
            const runway = new THREE.Mesh(new THREE.PlaneGeometry(80, 800), runwayMat);
            runway.rotation.x = -Math.PI / 2;
            runway.position.set(0, 0.01, 0);
            runway.receiveShadow = true;
            scene.add(runway);

            // Runway Markings
            const stripeMat = new THREE.MeshBasicMaterial({ color: 0xffffff });
            for (let z = -380; z < 380; z += 20) {
                const stripe = new THREE.Mesh(new THREE.PlaneGeometry(1.5, 8), stripeMat);
                stripe.rotation.x = -Math.PI / 2;
                stripe.position.set(0, 0.02, z);
                scene.add(stripe);
            }

            // Mega Jump Stunt Ramps
            createRamp(0, 0, 180, 24, 10, 30, 0);
            createRamp(-120, 0, 50, 18, 7, 22, Math.PI / 2);
            createRamp(120, 0, -80, 18, 7, 22, -Math.PI / 2);

            // Loop-The-Loop Stunt Structure
            createLoopTheLoop(0, 0, -220);

            // City Skyscrapers & Buildings
            for (let x = -350; x <= 350; x += 120) {
                for (let z = -350; z <= 350; z += 120) {
                    if (Math.abs(x) < 80 && Math.abs(z) < 250) continue; // Keep Runway Free
                    createSkyscraper(x, z);
                }
            }
        }

        function createRamp(x, y, z, width, height, length, rotationY) {
            const rampGroup = new THREE.Group();
            
            const shape = new THREE.Shape();
            shape.moveTo(0, 0);
            shape.lineTo(length, 0);
            shape.lineTo(length, height);
            shape.closePath();

            const extrudeSettings = { depth: width, bevelEnabled: false };
            const geo = new THREE.ExtrudeGeometry(shape, extrudeSettings);
            geo.rotateY(-Math.PI / 2);
            geo.translate(width / 2, 0, 0);

            const mat = new THREE.MeshStandardMaterial({ color: 0x0284c7, roughness: 0.3, metalness: 0.6 });
            const rampMesh = new THREE.Mesh(geo, mat);
            rampMesh.castShadow = true;
            rampMesh.receiveShadow = true;
            rampGroup.add(rampMesh);

            rampGroup.position.set(x, y, z);
            rampGroup.rotation.y = rotationY;
            scene.add(rampGroup);
        }

        function createLoopTheLoop(x, y, z) {
            const loopGeo = new THREE.TorusGeometry(22, 6, 16, 48, Math.PI * 1.8);
            const loopMat = new THREE.MeshStandardMaterial({ color: 0xf59e0b, roughness: 0.4 });
            const loopMesh = new THREE.Mesh(loopGeo, loopMat);
            loopMesh.position.set(x, 20, z);
            loopMesh.rotation.y = Math.PI / 2;
            loopMesh.castShadow = true;
            scene.add(loopMesh);
        }

        function createSkyscraper(x, z) {
            const h = 60 + Math.random() * 120;
            const geo = new THREE.BoxGeometry(40, h, 40);
            const mat = new THREE.MeshStandardMaterial({ color: 0x1e293b, roughness: 0.2, metalness: 0.8 });
            const bldg = new THREE.Mesh(geo, mat);
            bldg.position.set(x, h / 2, z);
            bldg.castShadow = true;
            bldg.receiveShadow = true;
            scene.add(bldg);
        }

        /* =========================================================================
           EXTREME SUPERCAR MODEL & WHEELS
           ========================================================================= */
        function createExtremeSupercar() {
            carGroup = new THREE.Group();

            const bodyMat = new THREE.MeshStandardMaterial({
                color: 0x06b6d4,
                metalness: 0.85,
                roughness: 0.15
            });

            // Aerodynamic Supercar Chassis
            const bodyGeo = new THREE.BoxGeometry(2.1, 0.6, 4.4);
            bodyMesh = new THREE.Mesh(bodyGeo, bodyMat);
            bodyMesh.position.y = 0.55;
            bodyMesh.castShadow = true;
            carGroup.add(bodyMesh);

            // Glass Cabin Roof
            const cabinGeo = new THREE.BoxGeometry(1.5, 0.55, 2.2);
            const glassMat = new THREE.MeshStandardMaterial({ color: 0x090d16, roughness: 0.05, metalness: 0.95 });
            const cabinMesh = new THREE.Mesh(cabinGeo, glassMat);
            cabinMesh.position.set(0, 1.05, -0.2);
            cabinMesh.castShadow = true;
            carGroup.add(cabinMesh);

            // Rear Stunt Spoiler
            const spoiler = new THREE.Mesh(new THREE.BoxGeometry(2.2, 0.08, 0.5), new THREE.MeshStandardMaterial({ color: 0x0f172a, metalness: 0.9 }));
            spoiler.position.set(0, 1.25, -2.1);
            carGroup.add(spoiler);

            // Headlights & Taillights
            const hlL = new THREE.SpotLight(0xffffff, 4, 60, Math.PI / 4, 0.4);
            hlL.position.set(0.75, 0.6, 2.2);
            hlL.target.position.set(0.75, 0, 15);
            carGroup.add(hlL);
            carGroup.add(hlL.target);
            headLights.push(hlL);

            const hlR = new THREE.SpotLight(0xffffff, 4, 60, Math.PI / 4, 0.4);
            hlR.position.set(-0.75, 0.6, 2.2);
            hlR.target.position.set(-0.75, 0, 15);
            carGroup.add(hlR);
            carGroup.add(hlR.target);
            headLights.push(hlR);

            // Alloy Wheels
            const wheelGeo = new THREE.CylinderGeometry(0.42, 0.42, 0.35, 24);
            wheelGeo.rotateZ(Math.PI / 2);
            const wheelMat = new THREE.MeshStandardMaterial({ color: 0x111827, roughness: 0.7 });
            const rimMat = new THREE.MeshStandardMaterial({ color: 0xe2e8f0, metalness: 0.95 });

            const wheelOffsets = [
                { x: 1.0, y: 0.42, z: 1.35 },   // Front Left
                { x: -1.0, y: 0.42, z: 1.35 },  // Front Right
                { x: 1.0, y: 0.42, z: -1.35 },  // Rear Left
                { x: -1.0, y: 0.42, z: -1.35 }   // Rear Right
            ];

            wheelOffsets.forEach(pos => {
                const wGroup = new THREE.Group();
                const tire = new THREE.Mesh(wheelGeo, wheelMat);
                tire.castShadow = true;
                wGroup.add(tire);

                const rim = new THREE.Mesh(new THREE.BoxGeometry(0.08, 0.75, 0.25), rimMat);
                wGroup.add(rim);

                wGroup.position.set(pos.x, pos.y, pos.z);
                carGroup.add(wGroup);
                wheelMeshes.push(wGroup);
            });

            scene.add(carGroup);
        }

        /* =========================================================================
           BREAKABLE PHYSICS PROPS (CRATES & TRAFFIC CONES)
           ========================================================================= */
        function spawnBreakableProps() {
            const crateGeo = new THREE.BoxGeometry(1.2, 1.2, 1.2);
            const crateMat = new THREE.MeshStandardMaterial({ color: 0x78350f, roughness: 0.8 });

            for (let i = 0; i < 25; i++) {
                const crate = new THREE.Mesh(crateGeo, crateMat);
                const rx = (Math.random() - 0.5) * 60;
                const rz = 40 + Math.random() * 200;
                crate.position.set(rx, 0.6, rz);
                crate.castShadow = true;
                scene.add(crate);

                props.push({
                    mesh: crate,
                    vel: new THREE.Vector3(0, 0, 0),
                    rotVel: new THREE.Vector3(0, 0, 0),
                    radius: 0.8
                });
            }
        }

        /* =========================================================================
           PARTICLE SYSTEMS (TIRE SMOKE & NITRO EXHAUST)
           ========================================================================= */
        function setupParticles() {
            particleGroup = new THREE.Group();
            scene.add(particleGroup);

            const smokeGeo = new THREE.SphereGeometry(0.35, 8, 8);
            const smokeMat = new THREE.MeshBasicMaterial({ color: 0xf1f5f9, transparent: true, opacity: 0 });

            for (let i = 0; i < 40; i++) {
                const p = new THREE.Mesh(smokeGeo, smokeMat.clone());
                p.visible = false;
                particleGroup.add(p);
                smokeParticles.push({ mesh: p, life: 0, maxLife: 1 });
            }
        }

        function triggerTireSmoke(pos) {
            const p = smokeParticles.find(item => !item.mesh.visible);
            if (!p) return;
            p.mesh.position.copy(pos);
            p.mesh.scale.setScalar(0.8);
            p.mesh.material.opacity = 0.6;
            p.mesh.visible = true;
            p.life = 0;
            p.maxLife = 0.6;
        }

        /* =========================================================================
           AUDIO SYNTHESIZER ENGINE
           ========================================================================= */
        function initAudio() {
            if (audioCtx) return;
            try {
                audioCtx = new (window.AudioContext || window.webkitAudioContext)();

                engineOsc = audioCtx.createOscillator();
                engineOsc.type = 'sawtooth';
                engineOsc.frequency.setValueAtTime(60, audioCtx.currentTime);

                engineFilter = audioCtx.createBiquadFilter();
                engineFilter.type = 'lowpass';
                engineFilter.frequency.setValueAtTime(400, audioCtx.currentTime);

                engineGain = audioCtx.createGain();
                engineGain.gain.setValueAtTime(0.12, audioCtx.currentTime);

                engineOsc.connect(engineFilter);
                engineFilter.connect(engineGain);
                engineGain.connect(audioCtx.destination);
                engineOsc.start();

                audioEnabled = true;
            } catch (e) {
                console.warn("Audio Context init blocked:", e);
            }
        }

        function updateAudio() {
            if (!audioEnabled || !audioCtx) return;
            const targetFreq = 50 + (engineRPM / 8000) * 450;
            engineOsc.frequency.setTargetAtTime(targetFreq, audioCtx.currentTime, 0.05);
            const filterFreq = 350 + (engineRPM / 8000) * 2600;
            engineFilter.frequency.setTargetAtTime(filterFreq, audioCtx.currentTime, 0.05);
        }

        /* =========================================================================
           INPUT EVENT HANDLERS & TOUCH CONTROLS
           ========================================================================= */
        function setupEvents() {
            window.addEventListener('keydown', (e) => {
                keyState[e.code] = true;
                if (e.code === 'KeyC') switchCamera();
                if (e.code === 'KeyR') resetCar();
                if (e.code === 'KeyF') unflipCar();
                if (e.code === 'KeyL') toggleLights();
                if (e.code === 'KeyM') toggleAudio();
                if (!audioCtx) initAudio();
            });

            window.addEventListener('keyup', (e) => {
                keyState[e.code] = false;
            });

            bindTouch('touch-gas', 'gas');
            bindTouch('touch-brake', 'brake');
            bindTouch('touch-left', 'left');
            bindTouch('touch-right', 'right');
            bindTouch('touch-handbrake', 'handbrake');

            const btnNitroTouch = document.getElementById('btn-nitro-touch');
            if (btnNitroTouch) {
                btnNitroTouch.addEventListener('touchstart', (e) => { e.preventDefault(); touchState.nitro = true; });
                btnNitroTouch.addEventListener('touchend', (e) => { e.preventDefault(); touchState.nitro = false; });
            }

            window.addEventListener('resize', onWindowResize);
        }

        function bindTouch(id, prop) {
            const btn = document.getElementById(id);
            if (!btn) return;
            const start = (e) => { e.preventDefault(); touchState[prop] = true; btn.classList.add('active'); if (!audioCtx) initAudio(); };
            const end = (e) => { e.preventDefault(); touchState[prop] = false; btn.classList.remove('active'); };
            btn.addEventListener('touchstart', start, { passive: false });
            btn.addEventListener('touchend', end, { passive: false });
            btn.addEventListener('mousedown', start);
            btn.addEventListener('mouseup', end);
            btn.addEventListener('mouseleave', end);
        }

        function setupUI() {
            document.getElementById('btn-camera').addEventListener('click', switchCamera);
            document.getElementById('btn-reset').addEventListener('click', resetCar);
            document.getElementById('btn-flip').addEventListener('click', unflipCar);
            document.getElementById('btn-lights').addEventListener('click', toggleLights);
            document.getElementById('btn-audio').addEventListener('click', toggleAudio);

            // Driving Mode Switcher
            document.getElementById('mode-comfort').addEventListener('click', () => setDriveMode('COMFORT'));
            document.getElementById('mode-sport').addEventListener('click', () => setDriveMode('SPORT'));
            document.getElementById('mode-drift').addEventListener('click', () => setDriveMode('DRIFT'));

            // Assist Toggles
            document.getElementById('btn-abs').addEventListener('click', () => toggleAssist('abs'));
            document.getElementById('btn-tc').addEventListener('click', () => toggleAssist('tc'));
            document.getElementById('btn-esp').addEventListener('click', () => toggleAssist('esp'));
        }

        function setDriveMode(mode) {
            driveMode = mode;
            document.querySelectorAll('.mode-btn').forEach(b => {
                b.className = "mode-btn px-3 py-1 rounded-xl text-xs font-bold font-orbitron bg-white/10 text-gray-300 hover:text-white";
            });
            const activeBtn = document.getElementById(`mode-${mode.toLowerCase()}`);
            if (activeBtn) {
                activeBtn.className = "mode-btn px-3 py-1 rounded-xl text-xs font-bold font-orbitron bg-cyan-500 text-white shadow-md shadow-cyan-500/30";
            }
            showToast("Driving Mode: " + mode);
        }

        function toggleAssist(type) {
            assists[type] = !assists[type];
            const btn = document.getElementById(`btn-${type}`);
            if (assists[type]) {
                btn.className = "toggle-badge active px-2.5 py-1 rounded-lg border text-[10px] font-bold font-orbitron";
            } else {
                btn.className = "toggle-badge inactive px-2.5 py-1 rounded-lg border text-[10px] font-bold font-orbitron";
            }
            showToast(`${type.toUpperCase()} Assist ${assists[type] ? "ON" : "OFF"}`);
        }

        /* =========================================================================
           ACTION HANDLERS & CAMERA SWITCHING
           ========================================================================= */
        function switchCamera() {
            cameraMode = (cameraMode + 1) % cameraModeNames.length;
            document.getElementById('cam-label').innerText = cameraModeNames[cameraMode];
            showToast("Camera: " + cameraModeNames[cameraMode]);
        }

        function unflipCar() {
            carPos.y += 1.0;
            carPitch = 0;
            carRoll = 0;
            carVel.set(0, 0, 0);
            showToast("Vehicle Unflipped Upright!");
        }

        function resetCar() {
            carPos.set(0, 0, 0);
            carVel.set(0, 0, 0);
            carYaw = 0;
            carPitch = 0;
            carRoll = 0;
            steerAngle = 0;
            currentSpeed = 0;
            showToast("Car Reset to Starting Grid!");
        }

        function toggleLights() {
            const on = headLights[0].intensity === 0;
            headLights.forEach(l => l.intensity = on ? 4 : 0);
            document.getElementById('icon-lights').className = on ? "fa-solid fa-lightbulb text-amber-400" : "fa-regular fa-lightbulb text-gray-400";
            showToast("Headlights " + (on ? "ON" : "OFF"));
        }

        function toggleAudio() {
            if (!audioCtx) {
                initAudio();
            } else {
                if (audioCtx.state === 'suspended') { audioCtx.resume(); audioEnabled = true; }
                else { audioCtx.suspend(); audioEnabled = false; }
            }
            document.getElementById('icon-audio').className = audioEnabled ? "fa-solid fa-volume-high text-sm" : "fa-solid fa-volume-xmark text-sm text-red-400";
        }

        function showToast(msg) {
            const toast = document.getElementById('toast-msg');
            toast.innerText = msg;
            toast.classList.remove('opacity-0', 'translate-y-2');
            setTimeout(() => toast.classList.add('opacity-0', 'translate-y-2'), 2500);
        }

        function onWindowResize() {
            camera.aspect = window.innerWidth / window.innerHeight;
            camera.updateProjectionMatrix();
            renderer.setSize(window.innerWidth, window.innerHeight);
        }

        /* =========================================================================
           PHYSICS & VEHICLE SIMULATION ENGINE
           ========================================================================= */
        let lastTime = performance.now();

        function animate() {
            requestAnimationFrame(animate);

            const now = performance.now();
            const delta = Math.min(0.05, (now - lastTime) / 1000);
            lastTime = now;

            // Input States
            const isAccelerating = keyState['KeyW'] || keyState['ArrowUp'] || touchState.gas;
            const isBraking = keyState['KeyS'] || keyState['ArrowDown'] || touchState.brake;
            const isSteerLeft = keyState['KeyA'] || keyState['ArrowLeft'] || touchState.left;
            const isSteerRight = keyState['KeyD'] || keyState['ArrowRight'] || touchState.right;
            const isHandbrake = keyState['Space'] || touchState.handbrake;
            const isNitroPressed = keyState['ShiftLeft'] || keyState['ShiftRight'] || touchState.nitro;

            // 1. Steering Logic
            const maxSteer = driveMode === 'DRIFT' ? 0.55 : 0.42;
            if (isSteerLeft) steerAngle = THREE.MathUtils.lerp(steerAngle, maxSteer, delta * 8);
            else if (isSteerRight) steerAngle = THREE.MathUtils.lerp(steerAngle, -maxSteer, delta * 8);
            else steerAngle = THREE.MathUtils.lerp(steerAngle, 0, delta * 12);

            // Front Wheel Visual Turn
            wheelMeshes[0].rotation.y = steerAngle;
            wheelMeshes[1].rotation.y = steerAngle;

            // 2. Acceleration & Engine Force (Reduced 3x for slower, more controllable driving)
            let accelForce = 0;
            const maxAccel = driveMode === 'SPORT' ? 9.3 : (driveMode === 'DRIFT' ? 10.7 : 6.7);

            if (isNitroPressed && nitroAmount > 0 && isAccelerating) {
                isNitroActive = true;
                nitroAmount = Math.max(0, nitroAmount - delta * 35);
                accelForce = maxAccel * 2.2;
            } else {
                isNitroActive = false;
                if (!isNitroPressed && nitroAmount < 100) nitroAmount = Math.min(100, nitroAmount + delta * 15);
                
                if (isAccelerating) accelForce = maxAccel;
                else if (isBraking) accelForce = -maxAccel * 0.7;
            }

            // Traction Control Check
            if (assists.tc && isAccelerating && Math.abs(steerAngle) > 0.3) {
                accelForce *= 0.65;
            }

            // Forward / Backward Driving Vectors
            const forwardDir = new THREE.Vector3(Math.sin(carYaw), 0, Math.cos(carYaw));
            const rightDir = new THREE.Vector3(Math.cos(carYaw), 0, -Math.sin(carYaw));

            // Apply Acceleration Impulse
            carVel.addScaledVector(forwardDir, accelForce * delta);

            // 3. Friction & Braking
            let drag = 0.985;
            if (isBraking && carVel.length() > 0.2) {
                drag = assists.abs ? 0.92 : 0.88;
            }
            if (isHandbrake) {
                drag = 0.95;
            }
            carVel.multiplyScalar(drag);

            // Turn Car Yaw based on Speed & Steering
            const forwardSpeed = carVel.dot(forwardDir);
            const turnRate = steerAngle * (forwardSpeed / 2.7) * (driveMode === 'DRIFT' ? 1.6 : 1.1);
            carYaw += turnRate * delta;

            // Lateral Drift Friction (Sliding)
            const sideVel = carVel.dot(rightDir);
            let grip = 0.92; // Normal Grip
            if (driveMode === 'DRIFT' || isHandbrake) grip = 0.985; // Low friction sliding

            carVel.addScaledVector(rightDir, -sideVel * (1 - grip));

            // Move Car Position (3x Slower World Velocity)
            carPos.addScaledVector(carVel, delta * 6);

            // Ground & Stunt Jump Altitude
            if (carPos.y > 0) {
                carVel.y -= 15 * delta; // Gravity
                carPos.y += carVel.y * delta;
                if (carPos.y <= 0) {
                    carPos.y = 0;
                    carVel.y = 0;
                }
            }

            // Sync Supercar Group Position
            carGroup.position.copy(carPos);
            carGroup.rotation.y = carYaw;

            // Wheel Spin Visual
            const wheelSpinSpeed = forwardSpeed * delta * 1.33;
            wheelMeshes.forEach(w => w.children[0].rotation.x += wheelSpinSpeed);

            // Calculate Speed in KM/H (Scaled down 3x to match new movement speed)
            currentSpeed = carVel.length() < 0.05 ? 0 : Math.round(carVel.length() * 6);

            // 4. Tire Smoke & Drift Counter (Thresholds updated for lower speed range)
            const isDrifting = (Math.abs(sideVel) > 0.75 || isHandbrake) && currentSpeed > 5;
            if (isDrifting) {
                const rearLeftPos = carPos.clone().add(new THREE.Vector3(1, 0.2, -1.3).applyAxisAngle(new THREE.Vector3(0,1,0), carYaw));
                triggerTireSmoke(rearLeftPos);

                activeDriftCombo += Math.round(Math.abs(sideVel) * 15);
                document.getElementById('drift-box').classList.remove('opacity-0', 'scale-90');
                document.getElementById('drift-score').innerText = `+${activeDriftCombo}`;
            } else if (activeDriftCombo > 0) {
                driftScore += activeDriftCombo;
                activeDriftCombo = 0;
                setTimeout(() => document.getElementById('drift-box').classList.add('opacity-0', 'scale-90'), 1000);
            }

            // 5. Breakable Props Physics Collision
            props.forEach(p => {
                const dist = p.mesh.position.distanceTo(carPos);
                if (dist < p.radius + 1.2) {
                    // Hit Prop!
                    p.vel.copy(carVel).multiplyScalar(1.4);
                    p.vel.y = 5 + Math.random() * 4;
                    p.rotVel.set(Math.random() * 10, Math.random() * 10, Math.random() * 10);
                }

                if (p.vel.length() > 0.1) {
                    p.mesh.position.addScaledVector(p.vel, delta);
                    p.mesh.rotation.x += p.rotVel.x * delta;
                    p.mesh.rotation.y += p.rotVel.y * delta;
                    p.vel.multiplyScalar(0.95); // Friction
                    if (p.mesh.position.y > 0.6) p.vel.y -= 12 * delta;
                    else { p.mesh.position.y = 0.6; p.vel.y = 0; }
                }
            });

            // Particles Update
            smokeParticles.forEach(p => {
                if (p.mesh.visible) {
                    p.life += delta;
                    p.mesh.position.y += delta * 1.2;
                    p.mesh.scale.addScalar(delta * 1.5);
                    p.mesh.material.opacity = 0.6 * (1 - p.life / p.maxLife);
                    if (p.life >= p.maxLife) p.mesh.visible = false;
                }
            });

            // RPM & Transmission
            if (isAccelerating) {
                engineRPM = Math.min(8000, 900 + (currentSpeed % 45) * 150 + currentSpeed * 18);
            } else {
                engineRPM = Math.max(800, engineRPM - 100);
            }

            if (currentSpeed < 2 && isBraking) currentGear = 'R';
            else if (currentSpeed < 35) currentGear = '1';
            else if (currentSpeed < 75) currentGear = '2';
            else if (currentSpeed < 120) currentGear = '3';
            else if (currentSpeed < 170) currentGear = '4';
            else currentGear = '5';

            // Update Audio Engine
            updateAudio();

            // Update Camera Position
            updateCamera();

            // Update HUD UI
            updateHUD();

            // Render WebGL Frame
            renderer.render(scene, camera);
        }

        /* =========================================================================
           CAMERA DYNAMICS & HUD UPDATE
           ========================================================================= */
        function updateCamera() {
            // FOV Expansion on High Speed
            const targetFOV = 60 + Math.min(25, (currentSpeed / 200) * 20 + (isNitroActive ? 12 : 0));
            cameraFOV += (targetFOV - cameraFOV) * 0.1;
            camera.fov = cameraFOV;
            camera.updateProjectionMatrix();

            if (cameraMode === 0) {
                // Chase Cam
                const offset = new THREE.Vector3(0, 3.2, -8.5).applyAxisAngle(new THREE.Vector3(0, 1, 0), carYaw);
                const targetPos = carPos.clone().add(offset);
                camera.position.lerp(targetPos, 0.2);
                camera.lookAt(carPos.clone().add(new THREE.Vector3(0, 1.2, 2.5).applyAxisAngle(new THREE.Vector3(0, 1, 0), carYaw)));
            } else if (cameraMode === 1) {
                // Cockpit View
                const offset = new THREE.Vector3(0, 1.15, 0.1).applyAxisAngle(new THREE.Vector3(0, 1, 0), carYaw);
                camera.position.copy(carPos.clone().add(offset));
                const lookTarget = carPos.clone().add(new THREE.Vector3(0, 1.15, 15).applyAxisAngle(new THREE.Vector3(0, 1, 0), carYaw));
                camera.lookAt(lookTarget);
            } else if (cameraMode === 2) {
                // Hood Cam
                const offset = new THREE.Vector3(0, 0.85, 1.5).applyAxisAngle(new THREE.Vector3(0, 1, 0), carYaw);
                camera.position.copy(carPos.clone().add(offset));
                const lookTarget = carPos.clone().add(new THREE.Vector3(0, 0.8, 15).applyAxisAngle(new THREE.Vector3(0, 1, 0), carYaw));
                camera.lookAt(lookTarget);
            } else if (cameraMode === 3) {
                // Orbit Cam
                const t = Date.now() * 0.0006;
                camera.position.set(carPos.x + Math.sin(t) * 12, carPos.y + 4.5, carPos.z + Math.cos(t) * 12);
                camera.lookAt(carPos);
            }
        }

        function updateHUD() {
            document.getElementById('speed-display').innerText = currentSpeed;
            document.getElementById('gear-display').innerText = currentGear;
            document.getElementById('rpm-display').innerText = Math.round(engineRPM);

            const nitroBar = document.getElementById('nitro-bar');
            if (nitroBar) nitroBar.style.height = `${nitroAmount}%`;

            const speedVignette = document.getElementById('speed-vignette');
            if (speedVignette) {
                speedVignette.style.opacity = Math.min(0.8, Math.max(0, (currentSpeed - 60) / 150) + (isNitroActive ? 0.4 : 0));
            }
        }
    </script>
</body>
