<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Apex Drive Ultra - Multi-Biome Open World</title>

    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    
    <!-- FontAwesome Icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    
    <!-- Google Fonts -->
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;600;800&family=Orbitron:wght@500;700;900&display=swap" rel="stylesheet">
    
    <!-- Three.js 3D Engine -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>

    <style>
        * {
            box-sizing: border-box;
            user-select: none;
            -webkit-user-select: none;
            touch-action: manipulation;
        }
        body, html {
            margin: 0;
            padding: 0;
            width: 100%;
            height: 100%;
            overflow: hidden;
            font-family: 'Outfit', sans-serif;
            background-color: #030712;
            color: #ffffff;
        }
        .font-orbitron {
            font-family: 'Orbitron', sans-serif;
        }
        #canvas-container {
            width: 100vw;
            height: 100vh;
            position: absolute;
            top: 0;
            left: 0;
            z-index: 1;
        }
        .glass-panel {
            background: rgba(15, 23, 42, 0.82);
            backdrop-filter: blur(16px);
            -webkit-backdrop-filter: blur(16px);
            border: 1px solid rgba(255, 255, 255, 0.12);
            box-shadow: 0 8px 32px 0 rgba(0, 0, 0, 0.5);
        }
        .glass-btn {
            background: rgba(255, 255, 255, 0.08);
            backdrop-filter: blur(8px);
            border: 1px solid rgba(255, 255, 255, 0.18);
            transition: all 0.15s ease;
        }
        .glass-btn:hover, .glass-btn:active {
            background: rgba(6, 182, 212, 0.35);
            border-color: rgba(103, 232, 249, 0.8);
            transform: scale(0.96);
        }
        .touch-pad {
            background: rgba(255, 255, 255, 0.12);
            backdrop-filter: blur(8px);
            border: 1px solid rgba(255, 255, 255, 0.25);
            border-radius: 9999px;
            display: flex;
            align-items: center;
            justify-content: center;
            color: white;
            font-size: 1.5rem;
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.4);
            transition: background 0.1s, transform 0.1s;
        }
        .touch-pad:active, .touch-pad.active {
            background: rgba(6, 182, 212, 0.65);
            border-color: rgba(103, 232, 249, 0.8);
            transform: scale(0.92);
        }
        .toggle-badge {
            transition: all 0.2s ease;
        }
        .toggle-badge.active {
            background-color: rgba(16, 185, 129, 0.25);
            border-color: rgba(52, 211, 153, 0.8);
            color: #34d399;
        }
        .toggle-badge.inactive {
            background-color: rgba(239, 68, 68, 0.2);
            border-color: rgba(248, 113, 113, 0.5);
            color: #f87171;
        }
        #minimap-canvas {
            border-radius: 50%;
            border: 2px solid rgba(6, 182, 212, 0.6);
            background: rgba(15, 23, 42, 0.85);
            box-shadow: 0 0 15px rgba(6, 182, 212, 0.3);
        }
        @keyframes pulse-ring {
            0% { transform: scale(0.95); opacity: 0.8; }
            50% { transform: scale(1.05); opacity: 1; }
            100% { transform: scale(0.95); opacity: 0.8; }
        }
        .speed-flash {
            animation: pulse-ring 0.4s ease-in-out infinite;
        }
    </style>
</head>
<body>

    <div id="canvas-container"></div>

    <!-- Speed Motion & Collision Impact Vignette -->
    <div id="speed-vignette" class="fixed inset-0 pointer-events-none z-[2] opacity-0 transition-opacity duration-300 bg-[radial-gradient(circle_at_center,transparent_30%,rgba(6,182,212,0.3)_80%,rgba(0,0,0,0.8)_100%)]"></div>
    <div id="impact-vignette" class="fixed inset-0 pointer-events-none z-[3] opacity-0 transition-opacity duration-100 bg-red-600/30"></div>

    <div id="ui-overlay" class="relative z-10 w-full h-full pointer-events-none flex flex-col justify-between p-3 sm:p-5">
        
        <!-- Top Controls & Mini Map Navigation -->
        <div class="flex justify-between items-start w-full gap-2">
            
            <!-- Branding & Biome Location Indicator -->
            <div class="glass-panel p-2.5 sm:p-3.5 rounded-2xl flex items-center gap-3 pointer-events-auto">
                <div class="w-10 h-10 rounded-xl bg-gradient-to-tr from-cyan-500 via-blue-600 to-indigo-600 flex items-center justify-center text-white shadow-lg shadow-cyan-500/30">
                    <i class="fa-solid fa-car-burst text-lg"></i>
                </div>
                <div>
                    <h1 class="font-orbitron text-xs sm:text-base font-black tracking-wider text-white">APEX <span class="text-cyan-400">ULTRA</span></h1>
                    <div class="flex items-center gap-2 mt-0.5">
                        <span class="w-2 h-2 rounded-full bg-cyan-400 animate-pulse"></span>
                        <span class="text-[10px] text-cyan-300 font-bold uppercase tracking-wider font-orbitron" id="location-label">AIRPORT RUNWAY STRIP</span>
                    </div>
                </div>
            </div>

            <!-- Top Action Bar & Assists -->
            <div class="flex items-center gap-2 pointer-events-auto flex-wrap justify-end">
                
                <!-- Driving Assists Toggles -->
                <div class="hidden md:flex items-center gap-1.5 glass-panel p-1.5 rounded-xl">
                    <button id="btn-abs" class="toggle-badge active px-2.5 py-1 rounded-lg border text-[10px] font-bold font-orbitron" title="Anti-lock Braking System">ABS</button>
                    <button id="btn-tc" class="toggle-badge active px-2.5 py-1 rounded-lg border text-[10px] font-bold font-orbitron" title="Traction Control System">TC</button>
                    <button id="btn-esp" class="toggle-badge active px-2.5 py-1 rounded-lg border text-[10px] font-bold font-orbitron" title="Electronic Stability Program">ESP</button>
                </div>

                <!-- Camera Switcher -->
                <button id="btn-camera" class="glass-btn h-10 px-3 rounded-xl flex items-center gap-2 text-gray-200 hover:text-white text-xs font-bold" title="Switch Camera (C)">
                    <i class="fa-solid fa-video text-cyan-400"></i>
                    <span id="cam-label" class="hidden sm:inline">Chase Cam</span>
                </button>

                <!-- Headlights Switch -->
                <button id="btn-lights" class="glass-btn w-10 h-10 rounded-xl flex items-center justify-center text-amber-400" title="Toggle Lights (L)">
                    <i id="icon-lights" class="fa-solid fa-lightbulb text-sm"></i>
                </button>

                <!-- Underglow Neon Toggle -->
                <button id="btn-neon" class="glass-btn w-10 h-10 rounded-xl flex items-center justify-center text-cyan-400" title="Toggle Underglow Neon (N)">
                    <i class="fa-solid fa-wand-magic-sparkles text-sm"></i>
                </button>

                <!-- Sound Engine Toggle -->
                <button id="btn-audio" class="glass-btn w-10 h-10 rounded-xl flex items-center justify-center text-gray-300" title="Toggle Sound Engine (M)">
                    <i id="icon-audio" class="fa-solid fa-volume-high text-sm"></i>
                </button>

                <!-- Unflip Vehicle -->
                <button id="btn-flip" class="glass-btn h-10 px-3 rounded-xl flex items-center gap-1.5 bg-amber-500/20 text-amber-300 hover:bg-amber-500/30 border-amber-500/40 text-xs font-bold" title="Unflip Car (F)">
                    <i class="fa-solid fa-car-on"></i>
                    <span class="hidden sm:inline">Flip</span>
                </button>

                <!-- Reset Vehicle -->
                <button id="btn-reset" class="glass-btn h-10 px-3 rounded-xl flex items-center gap-1.5 bg-red-500/20 text-red-300 hover:bg-red-500/30 border-red-500/40 text-xs font-bold" title="Reset Car Position (R)">
                    <i class="fa-solid fa-rotate-left"></i>
                    <span class="hidden sm:inline">Reset</span>
                </button>

                <!-- Minimap Radar Box -->
                <div class="glass-panel p-1 rounded-full pointer-events-auto ml-1 hidden sm:block">
                    <canvas id="minimap-canvas" width="100" height="100"></canvas>
                </div>
            </div>
        </div>

        <div class="flex flex-col items-center justify-center text-center my-auto">
            <!-- Drift Multiplier Score Card -->
            <div id="drift-box" class="opacity-0 transition-all duration-300 transform scale-90 glass-panel px-6 py-2.5 rounded-2xl border-cyan-500/50 shadow-xl shadow-cyan-500/20">
                <div class="text-[10px] uppercase tracking-widest text-cyan-400 font-bold">DRIFT & STUNT POINTS</div>
                <div id="drift-score" class="font-orbitron text-2xl sm:text-4xl font-black text-white">+0</div>
            </div>

            <!-- Speed Trap Radar Flash Toast -->
            <div id="speed-trap-box" class="hidden glass-panel px-6 py-3 rounded-2xl border-amber-500/80 shadow-2xl shadow-amber-500/40 text-center speed-flash">
                <div class="text-[10px] font-black text-amber-400 uppercase tracking-widest"><i class="fa-solid fa-camera text-sm mr-1"></i> SPEED TRAP RADAR</div>
                <div id="speed-trap-value" class="font-orbitron text-3xl font-black text-amber-300">248 KM/H</div>
            </div>

            <!-- Rings Collect Toast -->
            <div id="toast-msg" class="mt-2 glass-panel px-4 py-2 rounded-xl text-xs font-semibold text-cyan-200 opacity-0 transition-all duration-300 transform translate-y-2 border-cyan-500/30">
                Use W, S, A, D to Drive. Spacebar to Handbrake Drift!
            </div>
        </div>

        <div class="flex flex-col gap-2 w-full">
            
            <!-- Driving Mode Switcher Bar -->
            <div class="glass-panel p-1.5 rounded-2xl mx-auto pointer-events-auto flex items-center gap-1 border-white/10">
                <button id="mode-comfort" class="mode-btn px-3 py-1 rounded-xl text-xs font-bold font-orbitron bg-white/10 text-gray-300 hover:text-white">COMFORT</button>
                <button id="mode-sport" class="mode-btn px-3 py-1 rounded-xl text-xs font-bold font-orbitron bg-cyan-500 text-white shadow-md shadow-cyan-500/30">SPORT</button>
                <button id="mode-drift" class="mode-btn px-3 py-1 rounded-xl text-xs font-bold font-orbitron bg-white/10 text-amber-400 hover:text-amber-300">DRIFT</button>
            </div>

            <!-- Cockpit Gauge & Mobile Controls Layout -->
            <div class="flex justify-between items-end w-full gap-2 sm:gap-4">
                
                <!-- Mobile Steering Controls Left -->
                <div id="touch-left-container" class="pointer-events-auto flex gap-2 sm:hidden mb-1">
                    <button id="touch-left" class="touch-pad w-14 h-14"><i class="fa-solid fa-arrow-left"></i></button>
                    <button id="touch-right" class="touch-pad w-14 h-14"><i class="fa-solid fa-arrow-right"></i></button>
                </div>

                <!-- Digital Speedometer Dashboard -->
                <div class="glass-panel p-3 sm:p-4 rounded-3xl pointer-events-auto mx-auto flex items-center gap-4 sm:gap-6 border-cyan-500/20 shadow-cyan-500/10">
                    
                    <!-- Nitro NOS Meter -->
                    <div class="flex flex-col items-center justify-center border-r border-white/10 pr-3 sm:pr-4">
                        <span class="text-[9px] font-black text-cyan-400 uppercase tracking-widest mb-1">NOS</span>
                        <div class="w-3 h-16 sm:h-20 bg-gray-900 rounded-full overflow-hidden flex flex-col justify-end p-0.5 border border-white/10">
                            <div id="nitro-bar" class="w-full bg-gradient-to-t from-cyan-500 to-blue-400 rounded-full transition-all duration-100" style="height: 100%;"></div>
                        </div>
                        <button id="btn-nitro-touch" class="mt-1 sm:hidden text-[9px] bg-cyan-500/30 text-cyan-300 px-2 py-0.5 rounded font-bold">NOS</button>
                    </div>

                    <!-- Digital Speedometer Display -->
                    <div class="flex flex-col items-center justify-center px-2 sm:px-4">
                        <span id="speed-display" class="font-orbitron text-4xl sm:text-6xl font-black tracking-tight text-white">0</span>
                        <span class="text-[10px] font-black text-cyan-400 uppercase tracking-widest mt-1">KM / H</span>
                    </div>

                    <!-- Stunt Score & Rings Stats -->
                    <div class="flex flex-col justify-center gap-1 border-l border-white/10 pl-3 sm:pl-6">
                        <div class="flex items-center gap-2">
                            <span class="text-[10px] text-gray-400 font-bold">GEAR</span>
                            <span id="gear-display" class="font-orbitron font-black text-xl text-cyan-400">1</span>
                        </div>
                        <div class="flex items-center gap-2">
                            <span class="text-[10px] text-gray-400 font-bold">RINGS</span>
                            <span id="rings-display" class="font-orbitron text-xs font-bold text-amber-400"><i class="fa-solid fa-ring mr-1"></i>0 / 12</span>
                        </div>
                        <div class="flex items-center gap-2 mt-0.5">
                            <span id="badge-assist" class="text-[9px] bg-emerald-500/20 text-emerald-400 border border-emerald-500/30 px-1.5 py-0.5 rounded font-bold font-orbitron">TC OFF</span>
                        </div>
                    </div>
                </div>

                <!-- Mobile Acceleration & Handbrake Controls Right -->
                <div id="touch-right-container" class="pointer-events-auto flex items-end gap-1.5 sm:hidden mb-1">
                    <button id="touch-brake" class="touch-pad w-12 h-14 bg-red-500/20 text-red-400 border-red-500/30 text-xs"><i class="fa-solid fa-stop"></i></button>
                    <button id="touch-handbrake" class="touch-pad w-11 h-12 bg-amber-500/20 text-amber-400 border-amber-500/30 text-[10px] font-bold font-orbitron">P</button>
                    <button id="touch-gas" class="touch-pad w-14 h-16 bg-emerald-500/20 text-emerald-400 border-emerald-500/30 rounded-2xl"><i class="fa-solid fa-chevron-up"></i></button>
                </div>
            </div>
        </div>
    </div>

    <script>
        let scene, camera, renderer;
        let carGroup, bodyMesh, chassisMesh, wheelMeshes = [];
        let tailLightsMesh, brakeLightMat, reverseLightMat, headLights = [];
        let underglowLight, underglowMesh;
        let keyState = {};
        let touchState = { gas: false, brake: false, left: false, right: false, handbrake: false, nitro: false };

        // Assist Toggles
        let assists = { abs: true, tc: true, esp: true };
        let driveMode = "SPORT"; // COMFORT, SPORT, DRIFT

        // Vehicle Physics & Dynamics State
        let carPos = new THREE.Vector3(0, 0, 0);
        let carVel = new THREE.Vector3(0, 0, 0);
        let carYaw = 0; // Direction angle in radians
        let carPitch = 0, carRoll = 0;
        let targetPitch = 0, targetRoll = 0;
        let steerAngle = 0;

        let currentSpeed = 0; // KM/H
        let engineRPM = 800;
        let currentGear = "1";
        let isAirborne = false;

        // Nitro NOS
        let nitroAmount = 100;
        let isNitroActive = false;

        // Interactive World Collections
        let collideables = []; // Walls, Skyscrapers, Barriers, Ramps
        let ramps = [];        // Elevation driving physics
        let stuntRings = [];   // Floating collectible rings
        let speedTraps = [];   // Speed sensor traps
        let props = [];        // Breakable crates

        // Particles & Trail Effects
        let particleGroup, smokeParticles = [], sparkParticles = [];
        let skidTrailPoints = [];

        // Camera Systems
        let cameraMode = 0;
        const cameraModeNames = ["Chase Cam", "Cockpit Cam", "Hood Cam", "Orbit Cam"];
        let cameraFOV = 60;
        let camShakeTime = 0;

        // Web Audio Synthesizer
        let audioCtx, engineOsc, engineFilter, engineGain, screechOsc, screechGain, impactBuffer;
        let audioEnabled = false;

        // Gameplay Metrics
        let driftScore = 0;
        let activeDriftCombo = 0;
        let ringsCollected = 0;
        let speedTrapCooldown = 0;

        window.addEventListener('load', () => {
            initThree();
            initLighting();
            buildMultiBiomeWorldMap();
            createRealisticSupercar();
            spawnStuntRingsAndSpeedTraps();
            spawnBreakableProps();
            setupParticles();
            setupEvents();
            setupUI();

            // Start Main Engine Loop
            animate();

            showToast("Welcome to Apex Drive Ultra! Drive through cities, airport, sand dunes & stunt arenas!");
        });

        function initThree() {
            const container = document.getElementById('canvas-container');

            scene = new THREE.Scene();
            scene.background = new THREE.Color(0x0a0f1d);
            scene.fog = new THREE.FogExp2(0x0a0f1d, 0.0008);

            camera = new THREE.PerspectiveCamera(60, window.innerWidth / window.innerHeight, 0.1, 3500);
            camera.position.set(0, 5, -10);

            renderer = new THREE.WebGLRenderer({ antialias: true, powerPreference: "high-performance" });
            renderer.setSize(window.innerWidth, window.innerHeight);
            renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
            renderer.shadowMap.enabled = true;
            renderer.shadowMap.type = THREE.PCFSoftShadowMap;
            renderer.toneMapping = THREE.ACESFilmicToneMapping;
            renderer.toneMappingExposure = 1.25;
            container.appendChild(renderer.domElement);
        }

        function initLighting() {
            const ambient = new THREE.AmbientLight(0xdbeafe, 0.7);
            scene.add(ambient);

            const sun = new THREE.DirectionalLight(0xffedd5, 1.75);
            sun.position.set(250, 300, 150);
            sun.castShadow = true;
            sun.shadow.mapSize.width = 2048;
            sun.shadow.mapSize.height = 2048;
            sun.shadow.camera.near = 10;
            sun.shadow.camera.far = 1200;
            const d = 500;
            sun.shadow.camera.left = -d;
            sun.shadow.camera.right = d;
            sun.shadow.camera.top = d;
            sun.shadow.camera.bottom = -d;
            sun.shadow.bias = -0.0003;
            scene.add(sun);
        }

        function buildMultiBiomeWorldMap() {
            // Main Map World Ground (2400 x 2400 units)
            const groundGeo = new THREE.PlaneGeometry(2400, 2400, 64, 64);
            
            // Texture variation via vertex colors for 4 biomes
            const posAttr = groundGeo.attributes.position;
            const colors = [];
            for (let i = 0; i < posAttr.count; i++) {
                const x = posAttr.getX(i);
                const y = posAttr.getY(i);
                
                // Color according to map quadrant
                if (x < 0 && y > 0) {
                    // Downtown Asphalt (Dark slate gray)
                    colors.push(0.12, 0.16, 0.22);
                } else if (x >= 0 && y > 0) {
                    // Airport Strip Asphalt (Deep midnight blue)
                    colors.push(0.08, 0.11, 0.18);
                } else if (x < 0 && y <= 0) {
                    // Desert Dunes (Golden sand)
                    colors.push(0.85, 0.62, 0.32);
                } else {
                    // Stunt Arena Base (Cyan neon grid slate)
                    colors.push(0.09, 0.22, 0.30);
                }
            }
            groundGeo.setAttribute('color', new THREE.Float32BufferAttribute(colors, 3));

            const groundMat = new THREE.MeshStandardMaterial({
                vertexColors: true,
                roughness: 0.8,
                metalness: 0.1
            });
            const ground = new THREE.Mesh(groundGeo, groundMat);
            ground.rotation.x = -Math.PI / 2;
            ground.receiveShadow = true;
            scene.add(ground);

            // Perimeter Guardrail Boundary Walls (Collidable)
            createPerimeterWalls(1200);

            // ---------------------------------------------------------------------
            // BIOME 1: AIRPORT RUNWAY STRIP (X: 0 to 1000, Z: 0 to 1000)
            // ---------------------------------------------------------------------
            const runwayMat = new THREE.MeshStandardMaterial({ color: 0x0f172a, roughness: 0.4 });
            const runway = new THREE.Mesh(new THREE.PlaneGeometry(120, 1000), runwayMat);
            runway.rotation.x = -Math.PI / 2;
            runway.position.set(300, 0.02, 500);
            runway.receiveShadow = true;
            scene.add(runway);

            // Runway Markings
            const stripeMat = new THREE.MeshBasicMaterial({ color: 0xffffff });
            for (let z = 50; z < 950; z += 30) {
                const stripe = new THREE.Mesh(new THREE.PlaneGeometry(2.5, 12), stripeMat);
                stripe.rotation.x = -Math.PI / 2;
                stripe.position.set(300, 0.03, z);
                scene.add(stripe);
            }

            // Airport Hangars & Terminal Buildings (Collidable)
            createBuilding(120, 0, 300, 80, 22, 100, 0x1e293b);
            createBuilding(120, 0, 500, 80, 22, 100, 0x1e293b);
            createBuilding(120, 0, 700, 80, 22, 100, 0x1e293b);

            // Airport Take-off Ramps
            createRamp(300, 0, 850, 30, 14, 45, 0, 0x0284c7);

            // ---------------------------------------------------------------------
            // BIOME 2: DOWNTOWN CITY (X: -1000 to 0, Z: 0 to 1000)
            // ---------------------------------------------------------------------
            for (let x = -900; x <= -100; x += 180) {
                for (let z = 100; z <= 900; z += 180) {
                    const height = 80 + Math.random() * 160;
                    createSkyscraper(x, z, 70, height, 70);
                }
            }

            // Concrete Highway Barriers & Overpass Ramp
            createRamp(-400, 0, 400, 25, 12, 50, Math.PI / 4, 0x3b82f6);

            // ---------------------------------------------------------------------
            // BIOME 3: DESERT DUNES (X: -1000 to 0, Z: -1000 to 0)
            // ---------------------------------------------------------------------
            for (let i = 0; i < 35; i++) {
                const rx = -100 - Math.random() * 800;
                const rz = -100 - Math.random() * 800;
                const rRadius = 25 + Math.random() * 45;
                const rHeight = 8 + Math.random() * 18;
                createDune(rx, rz, rRadius, rHeight);
            }

            // Desert Cliff Launch Ramp
            createRamp(-500, 0, -500, 35, 18, 55, -Math.PI / 4, 0xd97706);

            // ---------------------------------------------------------------------
            // BIOME 4: STUNT ARENA (X: 0 to 1000, Z: -1000 to 0)
            // ---------------------------------------------------------------------
            // Mega Loop-the-Loop
            createLoopTheLoop(450, 0, -450);

            // Multi-tier Stunt Ramps
            createRamp(250, 0, -250, 40, 16, 40, Math.PI / 2, 0x06b6d4);
            createRamp(650, 0, -250, 40, 22, 50, -Math.PI / 2, 0x8b5cf6);
            createRamp(450, 0, -750, 50, 25, 60, 0, 0xf59e0b);
        }

        function createPerimeterWalls(boundary) {
            const wallMat = new THREE.MeshStandardMaterial({ color: 0x334155, roughness: 0.5 });
            const wallHeight = 20;

            const walls = [
                { x: 0, z: boundary, w: boundary * 2, d: 10 },
                { x: 0, z: -boundary, w: boundary * 2, d: 10 },
                { x: boundary, z: 0, w: 10, d: boundary * 2 },
                { x: -boundary, z: 0, w: 10, d: boundary * 2 }
            ];

            walls.forEach(w => {
                const mesh = new THREE.Mesh(new THREE.BoxGeometry(w.w, wallHeight, w.d), wallMat);
                mesh.position.set(w.x, wallHeight / 2, w.z);
                scene.add(mesh);

                collideables.push({
                    type: 'box',
                    minX: w.x - w.w / 2,
                    maxX: w.x + w.w / 2,
                    minZ: w.z - w.d / 2,
                    maxZ: w.z + w.d / 2
                });
            });
        }

        function createSkyscraper(x, z, width, height, depth) {
            const colors = [0x1e293b, 0x0f172a, 0x334155, 0x0284c7];
            const mat = new THREE.MeshStandardMaterial({
                color: colors[Math.floor(Math.random() * colors.length)],
                roughness: 0.2,
                metalness: 0.8
            });
            const bldg = new THREE.Mesh(new THREE.BoxGeometry(width, height, depth), mat);
            bldg.position.set(x, height / 2, z);
            bldg.castShadow = true;
            bldg.receiveShadow = true;
            scene.add(bldg);

            // Register Bounding Box for Wall Collisions
            collideables.push({
                type: 'box',
                minX: x - width / 2 - 1.2,
                maxX: x + width / 2 + 1.2,
                minZ: z - depth / 2 - 1.2,
                maxZ: z + depth / 2 + 1.2
            });
        }

        function createBuilding(x, y, z, width, height, depth, colorHex) {
            const mat = new THREE.MeshStandardMaterial({ color: colorHex, roughness: 0.4 });
            const bldg = new THREE.Mesh(new THREE.BoxGeometry(width, height, depth), mat);
            bldg.position.set(x, y + height / 2, z);
            bldg.castShadow = true;
            bldg.receiveShadow = true;
            scene.add(bldg);

            collideables.push({
                type: 'box',
                minX: x - width / 2 - 1.2,
                maxX: x + width / 2 + 1.2,
                minZ: z - depth / 2 - 1.2,
                maxZ: z + depth / 2 + 1.2
            });
        }

        function createRamp(x, y, z, width, height, length, rotationY, colorHex) {
            const rampGroup = new THREE.Group();
            
            const shape = new THREE.Shape();
            shape.moveTo(0, 0);
            shape.lineTo(length, 0);
            shape.lineTo(length, height);
            shape.closePath();

            const extrudeSettings = { depth: width, bevelEnabled: false };
            const geo = new THREE.ExtrudeGeometry(shape, extrudeSettings);
            geo.rotateY(-Math.PI / 2);
            geo.translate(width / 2, 0, 0);

            const mat = new THREE.MeshStandardMaterial({ color: colorHex, roughness: 0.3, metalness: 0.6 });
            const rampMesh = new THREE.Mesh(geo, mat);
            rampMesh.castShadow = true;
            rampMesh.receiveShadow = true;
            rampGroup.add(rampMesh);

            rampGroup.position.set(x, y, z);
            rampGroup.rotation.y = rotationY;
            scene.add(rampGroup);

            // Register Ramp Physics Geometry
            ramps.push({
                x, z, width, height, length, rotationY
            });
        }

        function triggerTireSmoke(pos) {
            const p = smokeParticles.find(item => !item.mesh.visible);

            p.mesh.position.copy(pos);
            p.mesh.scale.setScalar(0.8);
            p.mesh.material.opacity = 0.65;
            p.mesh.visible = true;
            p.life = 0;
            p.maxLife = 0.55;
        }

        function triggerSparks(pos) {
            for (let i = 0; i < 8; i++) {
                const s = sparkParticles.find(item => !item.mesh.visible);
                if (!s) break;
                s.mesh.position.copy(pos);
                s.vel.set((Math.random() - 0.5) * 15, Math.random() * 12 + 2, (Math.random() - 0.5) * 15);
                s.mesh.visible = true;
                s.life = 0;
            }
        }

        function initAudio() {
            if (audioCtx) return;
            try {
                audioCtx = new (window.AudioContext || window.webkitAudioContext)();

                engineOsc = audioCtx.createOscillator();
                engineOsc.type = 'sawtooth';
                engineOsc.frequency.setValueAtTime(65, audioCtx.currentTime);

                engineFilter = audioCtx.createBiquadFilter();
                engineFilter.type = 'lowpass';
                engineFilter.frequency.setValueAtTime(450, audioCtx.currentTime);

                engineGain = audioCtx.createGain();
                engineGain.gain.setValueAtTime(0.1, audioCtx.currentTime);

                engineOsc.connect(engineFilter);
                engineFilter.connect(engineGain);
                engineGain.connect(audioCtx.destination);
                engineOsc.start();

                audioEnabled = true;
            } catch (e) {
                console.warn("Audio Context init blocked:", e);
            }
        }

        function updateAudio() {
            if (!audioEnabled || !audioCtx) return;
            const targetFreq = 55 + (engineRPM / 8000) * 480;
            engineOsc.frequency.setTargetAtTime(targetFreq, audioCtx.currentTime, 0.05);
            const filterFreq = 400 + (engineRPM / 8000) * 2800;
            engineFilter.frequency.setTargetAtTime(filterFreq, audioCtx.currentTime, 0.05);
        }

        function playImpactSound() {
            if (!audioEnabled || !audioCtx) return;
            const osc = audioCtx.createOscillator();
            const gain = audioCtx.createGain();
            osc.type = 'square';
            osc.frequency.setValueAtTime(120, audioCtx.currentTime);
            osc.frequency.exponentialRampToValueAtTime(30, audioCtx.currentTime + 0.2);
            gain.gain.setValueAtTime(0.3, audioCtx.currentTime);
            gain.gain.exponentialRampToValueAtTime(0.01, audioCtx.currentTime + 0.2);
            osc.connect(gain);
            gain.connect(audioCtx.destination);
            osc.start();
            osc.stop(audioCtx.currentTime + 0.2);
        }

        function setupEvents() {
            window.addEventListener('keydown', (e) => {
                keyState[e.code] = true;
                if (e.code === 'KeyC') switchCamera();
                if (e.code === 'KeyR') resetCar();
                if (e.code === 'KeyF') unflipCar();
                if (e.code === 'KeyL') toggleLights();
                if (e.code === 'KeyN') toggleUnderglow();
                if (e.code === 'KeyM') toggleAudio();
                if (!audioCtx) initAudio();
            });

            window.addEventListener('keyup', (e) => {
                keyState[e.code] = false;
            });

            bindTouch('touch-gas', 'gas');
            bindTouch('touch-brake', 'brake');
            bindTouch('touch-left', 'left');
            bindTouch('touch-right', 'right');
            bindTouch('touch-handbrake', 'handbrake');

            const btnNitroTouch = document.getElementById('btn-nitro-touch');
            if (btnNitroTouch) {
                btnNitroTouch.addEventListener('touchstart', (e) => { e.preventDefault(); touchState.nitro = true; });
                btnNitroTouch.addEventListener('touchend', (e) => { e.preventDefault(); touchState.nitro = false; });
            }

            window.addEventListener('resize', onWindowResize);
        }

        function bindTouch(id, prop) {
            const btn = document.getElementById(id);
            if (!btn) return;
            const start = (e) => { e.preventDefault(); touchState[prop] = true; btn.classList.add('active'); if (!audioCtx) initAudio(); };
            const end = (e) => { e.preventDefault(); touchState[prop] = false; btn.classList.remove('active'); };
            btn.addEventListener('touchstart', start, { passive: false });
            btn.addEventListener('touchend', end, { passive: false });
            btn.addEventListener('mousedown', start);
            btn.addEventListener('mouseup', end);
            btn.addEventListener('mouseleave', end);
        }

        function onWindowResize() {

        let lastTime = performance.now();

        function animate() {
            requestAnimationFrame(animate);

            const now = performance.now();
            const delta = Math.min(0.05, (now - lastTime) / 1000);
            lastTime = now;

            // User Control Inputs
            const isAccelerating = keyState['KeyW'] || keyState['ArrowUp'] || touchState.gas;
            const isBraking = keyState['KeyS'] || keyState['ArrowDown'] || touchState.brake;
            const isSteerLeft = keyState['KeyA'] || keyState['ArrowLeft'] || touchState.left;
            const isSteerRight = keyState['KeyD'] || keyState['ArrowRight'] || touchState.right;
            const isHandbrake = keyState['Space'] || touchState.handbrake;
            const isNitroPressed = keyState['ShiftLeft'] || keyState['ShiftRight'] || touchState.nitro;

            // 1. Steering & Wheel Rotations
            const maxSteer = driveMode === 'DRIFT' ? 0.58 : 0.44;
            if (isSteerLeft) steerAngle = THREE.MathUtils.lerp(steerAngle, maxSteer, delta * 8);
            else if (isSteerRight) steerAngle = THREE.MathUtils.lerp(steerAngle, -maxSteer, delta * 8);
            else steerAngle = THREE.MathUtils.lerp(steerAngle, 0, delta * 12);

            wheelMeshes[0].rotation.y = steerAngle;
            wheelMeshes[1].rotation.y = steerAngle;

            // 2. Acceleration & Engine Force
            let accelForce = 0;
            const maxAccel = driveMode === 'SPORT' ? 10.5 : (driveMode === 'DRIFT' ? 12.0 : 7.5);

            if (isNitroPressed && nitroAmount > 0 && isAccelerating) {
                isNitroActive = true;
                nitroAmount = Math.max(0, nitroAmount - delta * 35);
                accelForce = maxAccel * 2.2;
            } else {
                isNitroActive = false;
                if (!isNitroPressed && nitroAmount < 100) nitroAmount = Math.min(100, nitroAmount + delta * 15);
                
                if (isAccelerating) accelForce = maxAccel;
                else if (isBraking) accelForce = -maxAccel * 0.75;
            }

            // Traction Control System
            if (assists.tc && isAccelerating && Math.abs(steerAngle) > 0.3) {
                accelForce *= 0.65;
            }

            // Direction Vectors
            const forwardDir = new THREE.Vector3(Math.sin(carYaw), 0, Math.cos(carYaw));
            const rightDir = new THREE.Vector3(Math.cos(carYaw), 0, -Math.sin(carYaw));

            // Apply Acceleration Impulse
            carVel.addScaledVector(forwardDir, accelForce * delta);

            // 3. Friction & Drag Coefficients
            let drag = 0.985;
            if (isBraking && carVel.length() > 0.2) drag = assists.abs ? 0.92 : 0.88;
            if (isHandbrake) drag = 0.94;
            carVel.multiplyScalar(drag);

            // Turn Car Yaw based on Steering Angle and Forward Velocity
            const forwardSpeed = carVel.dot(forwardDir);
            const turnRate = steerAngle * (forwardSpeed / 2.6) * (driveMode === 'DRIFT' ? 1.65 : 1.15);
            carYaw += turnRate * delta;

            // Lateral Friction (Drift Sliding)
            const sideVel = carVel.dot(rightDir);
            let grip = 0.91;
            if (driveMode === 'DRIFT' || isHandbrake) grip = 0.985; // Low friction drift

            carVel.addScaledVector(rightDir, -sideVel * (1 - grip));

            // Proposed Next Position
            const nextPos = carPos.clone().addScaledVector(carVel, delta * 6);

            // 4. WALL & BUILDING COLLISION SYSTEM
            let hasCollided = false;
            for (let c of collideables) {
                if (nextPos.x > c.minX && nextPos.x < c.maxX && nextPos.z > c.minZ && nextPos.z < c.maxZ) {
                    hasCollided = true;
                    // Bounce off object
                    carVel.multiplyScalar(-0.4); // Reverses velocity and absorbs energy
                    triggerSparks(nextPos);
                    playImpactSound();

                    // Camera Shake & Red Impact Vignette
                    camShakeTime = 0.25;
                    const impactUI = document.getElementById('impact-vignette');
                    impactUI.style.opacity = '1';
                    setTimeout(() => impactUI.style.opacity = '0', 150);
                    break;
                }
            }

            if (!hasCollided) {
                carPos.copy(nextPos);
            }

            // 5. RAMP PHYSICS & ELEVATION HEIGHT SOLVER
            let onRampHeight = 0;
            let isOnRamp = false;

            ramps.forEach(r => {
                const dx = carPos.x - r.x;
                const dz = carPos.z - r.z;
                
                // Rotate coordinates into ramp local space
                const localX = dx * Math.cos(-r.rotationY) - dz * Math.sin(-r.rotationY);
                const localZ = dx * Math.sin(-r.rotationY) + dz * Math.cos(-r.rotationY);

                if (Math.abs(localX) < r.width / 2 && localZ >= 0 && localZ <= r.length) {
                    // Drive up incline slope
                    onRampHeight = (localZ / r.length) * r.height;
                    isOnRamp = true;
                }
            });

            // Vertical Elevation & Gravity Jump
            if (isOnRamp) {
                carPos.y = THREE.MathUtils.lerp(carPos.y, onRampHeight, delta * 15);
                carVel.y = forwardSpeed * 0.4; // Launch impulse angle
                isAirborne = false;
            } else if (carPos.y > 0.05) {
                isAirborne = true;
                carVel.y -= 22 * delta; // Free fall gravity
                carPos.y += carVel.y * delta;

                if (carPos.y <= 0) {
                    carPos.y = 0;
                    carVel.y = 0;
                    isAirborne = false;
                }
            } else {
                carPos.y = 0;
                isAirborne = false;
            }

            // 6. REALISTIC SUSPENSION PITCH & ROLL
            targetPitch = (accelForce / maxAccel) * -0.08 + (isAirborne ? -0.15 : 0);
            targetRoll = (sideVel / 15) * 0.12;

            carPitch = THREE.MathUtils.lerp(carPitch, targetPitch, delta * 6);
            carRoll = THREE.MathUtils.lerp(carRoll, targetRoll, delta * 6);

            // Sync Car Model
            carGroup.position.copy(carPos);
            carGroup.rotation.y = carYaw;
            chassisMesh.rotation.x = carPitch;
            chassisMesh.rotation.z = carRoll;

            // Wheels Spin
            const wheelSpinSpeed = forwardSpeed * delta * 1.35;
            wheelMeshes.forEach(w => w.children[0].rotation.x += wheelSpinSpeed);

            // Speed in KM/H
            currentSpeed = carVel.length() < 0.05 ? 0 : Math.round(carVel.length() * 6);

            // Taillights Dynamic Brake / Reverse Glow
            if (isBraking && currentSpeed > 2) {
                brakeLightMat.color.setHex(0xef4444); // Bright Red
            } else if (isBraking && currentSpeed <= 2) {
                brakeLightMat.color.setHex(0xffffff); // White Reverse
            } else {
                brakeLightMat.color.setHex(0x991b1b); // Dim Red
            }

            // 7. STUNT RINGS & SPEED TRAP RADAR CHECK
            stuntRings.forEach(ring => {
                if (!ring.collected && carPos.distanceTo(ring.pos) < 6) {
                    ring.collected = true;
                    ring.mesh.visible = false;
                    ringsCollected++;
                    driftScore += 1000;
                    showToast(`+1000 STUNT RING COLLECTED! (${ringsCollected}/12)`);
                    document.getElementById('rings-display').innerText = `${ringsCollected} / 12`;
                }
            });

            if (speedTrapCooldown > 0) speedTrapCooldown -= delta;
            speedTraps.forEach(trap => {
                if (speedTrapCooldown <= 0 && carPos.distanceTo(trap.pos) < 12 && currentSpeed > 40) {
                    speedTrapCooldown = 4.0;
                    const trapBox = document.getElementById('speed-trap-box');
                    document.getElementById('speed-trap-value').innerText = `${currentSpeed} KM/H`;
                    trapBox.classList.remove('hidden');
                    setTimeout(() => trapBox.classList.add('hidden'), 2500);
                }
            });

            // 8. DRIFT COUNTER & TIRE SMOKE
            const isDrifting = (Math.abs(sideVel) > 0.75 || isHandbrake) && currentSpeed > 6;
            if (isDrifting) {
                const rearPos = carPos.clone().add(new THREE.Vector3(1, 0.2, -1.3).applyAxisAngle(new THREE.Vector3(0,1,0), carYaw));
                triggerTireSmoke(rearPos);

                activeDriftCombo += Math.round(Math.abs(sideVel) * 18);
                document.getElementById('drift-box').classList.remove('opacity-0', 'scale-90');
                document.getElementById('drift-score').innerText = `+${activeDriftCombo}`;
            } else if (activeDriftCombo > 0) {
                driftScore += activeDriftCombo;
                activeDriftCombo = 0;
                setTimeout(() => document.getElementById('drift-box').classList.add('opacity-0', 'scale-90'), 1000);
            }

            // Breakable Props Collision Physics
            props.forEach(p => {
                const dist = p.mesh.position.distanceTo(carPos);
                if (dist < p.radius + 1.2) {
                    p.vel.copy(carVel).multiplyScalar(1.5);
                    p.vel.y = 6 + Math.random() * 4;
                    p.rotVel.set(Math.random() * 10, Math.random() * 10, Math.random() * 10);
                }

                if (p.vel.length() > 0.1) {
                    p.mesh.position.addScaledVector(p.vel, delta);
                    p.mesh.rotation.x += p.rotVel.x * delta;
                    p.mesh.rotation.y += p.rotVel.y * delta;
                    p.vel.multiplyScalar(0.95);
                    if (p.mesh.position.y > 0.7) p.vel.y -= 14 * delta;
                    else { p.mesh.position.y = 0.7; p.vel.y = 0; }
                }
            });

            // Particles Update
            smokeParticles.forEach(p => {
                if (p.mesh.visible) {
                    p.life += delta;
                    p.mesh.position.y += delta * 1.3;
                    p.mesh.scale.addScalar(delta * 1.6);
                    p.mesh.material.opacity = 0.65 * (1 - p.life / p.maxLife);
                    if (p.life >= p.maxLife) p.mesh.visible = false;
                }
            });

            sparkParticles.forEach(s => {
                if (s.mesh.visible) {
                    s.life += delta;
                    s.mesh.position.addScaledVector(s.vel, delta);
                    if (s.life > 0.3) s.mesh.visible = false;
                }
            });

            // Engine Transmission RPM
            if (isAccelerating) {
                engineRPM = Math.min(8200, 900 + (currentSpeed % 48) * 150 + currentSpeed * 18);
            } else {
                engineRPM = Math.max(800, engineRPM - 120);
            }

            if (currentSpeed < 2 && isBraking) currentGear = 'R';
            else if (currentSpeed < 38) currentGear = '1';
            else if (currentSpeed < 80) currentGear = '2';
            else if (currentSpeed < 130) currentGear = '3';
            else if (currentSpeed < 185) currentGear = '4';
            else currentGear = '5';

            updateAudio();
            updateCamera(delta);
            updateHUD();
            drawMinimap();

            // Render WebGL Frame
            renderer.render(scene, camera);
        }

        function updateCamera(delta) {
            const targetFOV = 60 + Math.min(25, (currentSpeed / 200) * 20 + (isNitroActive ? 14 : 0));
            cameraFOV += (targetFOV - cameraFOV) * 0.1;
            camera.fov = cameraFOV;
            camera.updateProjectionMatrix();

            // Camera Shake on Wall Hit Impact
            let shakeOffset = new THREE.Vector3();
            if (camShakeTime > 0) {
                camShakeTime -= delta;
                shakeOffset.set((Math.random() - 0.5) * 0.8, (Math.random() - 0.5) * 0.8, (Math.random() - 0.5) * 0.8);
            }

            if (cameraMode === 0) {
                // Chase Cam
                const offset = new THREE.Vector3(0, 3.4, -9.0).applyAxisAngle(new THREE.Vector3(0, 1, 0), carYaw);
                const targetPos = carPos.clone().add(offset).add(shakeOffset);
                camera.position.lerp(targetPos, 0.22);
                camera.lookAt(carPos.clone().add(new THREE.Vector3(0, 1.2, 2.5).applyAxisAngle(new THREE.Vector3(0, 1, 0), carYaw)));
            } else if (cameraMode === 1) {
                // Cockpit Cam
                const offset = new THREE.Vector3(0, 1.15, 0.1).applyAxisAngle(new THREE.Vector3(0, 1, 0), carYaw);
                camera.position.copy(carPos.clone().add(offset).add(shakeOffset));
                const lookTarget = carPos.clone().add(new THREE.Vector3(0, 1.15, 15).applyAxisAngle(new THREE.Vector3(0, 1, 0), carYaw));
                camera.lookAt(lookTarget);
            } else if (cameraMode === 2) {
                // Hood Cam
                const offset = new THREE.Vector3(0, 0.85, 1.6).applyAxisAngle(new THREE.Vector3(0, 1, 0), carYaw);
                camera.position.copy(carPos.clone().add(offset).add(shakeOffset));
                const lookTarget = carPos.clone().add(new THREE.Vector3(0, 0.8, 15).applyAxisAngle(new THREE.Vector3(0, 1, 0), carYaw));
                camera.lookAt(lookTarget);
            } else if (cameraMode === 3) {
                // Orbit Cam
                const t = Date.now() * 0.0006;
                camera.position.set(carPos.x + Math.sin(t) * 14, carPos.y + 5, carPos.z + Math.cos(t) * 14);
                camera.lookAt(carPos);
            }
        }

        function updateHUD() {
            document.getElementById('speed-display').innerText = currentSpeed;
            document.getElementById('gear-display').innerText = currentGear;

            const nitroBar = document.getElementById('nitro-bar');
            if (nitroBar) nitroBar.style.height = `${nitroAmount}%`;

            const speedVignette = document.getElementById('speed-vignette');
            if (speedVignette) {
                speedVignette.style.opacity = Math.min(0.8, Math.max(0, (currentSpeed - 60) / 150) + (isNitroActive ? 0.45 : 0));
            }

            // Biome Location Identification
            const locLabel = document.getElementById('location-label');
            if (carPos.x >= 0 && carPos.z >= 0) locLabel.innerText = "AIRPORT RUNWAY STRIP";
            else if (carPos.x < 0 && carPos.z >= 0) locLabel.innerText = "DOWNTOWN CITY";
            else if (carPos.x < 0 && carPos.z < 0) locLabel.innerText = "DESERT DUNES";
            else locLabel.innerText = "STUNT ARENA";
        }

        function drawMinimap() {
            const canvas = document.getElementById('minimap-canvas');
            if (!canvas) return;
            const ctx = canvas.getContext('2d');
            const w = canvas.width;
            const h = canvas.height;

            ctx.clearRect(0, 0, w, h);

            // Center relative to car pos
            ctx.save();
            ctx.translate(w / 2, h / 2);

            const scale = 0.07;

            // Draw Biome Quadrants
            ctx.fillStyle = "rgba(15, 23, 42, 0.8)";
            ctx.fillRect(-w, -h, w * 2, h * 2);

            // Stunt Rings Radar Dots
            ctx.fillStyle = "#f59e0b";
            stuntRings.forEach(ring => {
                if (!ring.collected) {
                    const rx = (ring.pos.x - carPos.x) * scale;
                    const rz = -(ring.pos.z - carPos.z) * scale;
                    ctx.beginPath();
                    ctx.arc(rx, rz, 2.5, 0, Math.PI * 2);
                    ctx.fill();
                }
            });

            // Player Car Triangle Marker
            ctx.fillStyle = "#06b6d4";
            ctx.save();
            ctx.rotate(-carYaw);
            ctx.beginPath();
            ctx.moveTo(0, -6);
            ctx.lineTo(-4, 5);
            ctx.lineTo(4, 5);
            ctx.closePath();
            ctx.fill();
            ctx.restore();

            ctx.restore();
        }
    </script>
</body>
